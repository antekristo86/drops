<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>scramble</title>
<style>
  @font-face {
    font-family: 'TFCBitNeue';
    src: url('./TFCBitNeue-Regular.otf') format('opentype');
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: crosshair; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: 'TFCBitNeue', monospace;
    color: #fff;
    font-size: clamp(18px, 4vw, 42px);
    letter-spacing: 0.04em;
    cursor: crosshair;
    -webkit-font-smoothing: none;
  }
</style>
</head>
<body>
<span id="t">STRATEGY</span>
<script>
// text scramble. characters flick through noise, resolve left to right.
const WORDS = ['STRATEGY', 'PRODUCT', 'BRAND', 'TASTE', 'JUDGMENT'];
const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&/=+*';
const DURATION = 550;
const el = document.getElementById('t');

let idx = 0, scr = null;

setInterval(() => {
  idx = (idx + 1) % WORDS.length;
  scr = { target: WORDS[idx], start: performance.now() };
}, 2200);

function tick() {
  if (scr) {
    const t = (performance.now() - scr.start) / DURATION;
    const tg = scr.target;
    if (t >= 1) {
      el.textContent = tg;
      scr = null;
    } else {
      const reveal = Math.floor(t * tg.length);
      let s = '';
      for (let i = 0; i < tg.length; i++) {
        s += i < reveal ? tg[i] : CHARS[(Math.random() * CHARS.length) | 0];
      }
      el.textContent = s;
    }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
