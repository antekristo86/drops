<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>scramble scroll</title>
<style>
  @font-face {
    font-family: 'TFCBitNeue';
    src: url('./TFCBitNeue-Regular.otf') format('opentype');
    font-display: block;
  }
  html, body { margin: 0; background: #000; cursor: crosshair; }
  html { overflow-x: hidden; }
  .line {
    font-family: 'TFCBitNeue', monospace;
    font-size: 15px; line-height: 17px;
    color: #fff; text-align: center;
    white-space: nowrap;
    margin: 48vh 0;
  }
  .line:first-child { margin-top: 46vh; }
  .line:last-child { margin-bottom: 52vh; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// scramble scroll. text resolves out of flickering glyphs on the way
// into the viewport and dissolves back into them on the way out. a
// directional front sweeps each line: ahead the original, at the front
// a scrambling glyph, behind it nothing. fully reversible, the scroll
// position is the only clock.
const LINES = [
  'SCRAMBLE SCROLL',
  'TEXT RESOLVES ON THE WAY IN',
  'AND DISSOLVES ON THE WAY OUT',
  'THE SCROLL IS THE ONLY CLOCK',
  'RUN IT BACKWARDS. SAME MOVIE'
];

const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/·&';
const NB = String.fromCharCode(160);  // nbsp keeps the slot, nothing reflows

const stage = document.getElementById('stage');
const els = LINES.map(t => {
  const d = document.createElement('div');
  d.className = 'line';
  d.textContent = t;
  stage.appendChild(d);
  return d;
});

// both directions read left to right: the first letter arrives first
// and leaves first
function posOf(i, len, mode) {
  return i / len;
}

// one renderer for both directions: mode +1 reveals with q, -1 dissolves
function render(el, text, q, mode) {
  if (mode > 0 && q >= 1) { if (el.textContent !== text) el.textContent = text; return; }
  if (mode < 0 && q <= 0) { if (el.textContent !== text) el.textContent = text; return; }
  const len = text.length;
  const band = 0.16;
  const front = (mode > 0 ? q : q) * (1 + band);
  const seed = Math.floor(q * 70);
  let out = '';
  for (let i = 0; i < len; i++) {
    const c = text[i];
    if (c === ' ') { out += ' '; continue; }
    const f = posOf(i, len, mode);
    if (mode > 0) {
      if (f < front - band) out += c;
      else if (f >= front) out += NB;
      else out += CHARS[(i * 7 + seed * 13) % CHARS.length];
    } else {
      if (f < front - band) out += NB;
      else if (f > front) out += c;
      else out += CHARS[(i * 7 + seed * 13) % CHARS.length];
    }
  }
  el.textContent = out;
}

function frame() {
  const vh = innerHeight;
  els.forEach((el, i) => {
    const r = el.getBoundingClientRect();
    // scroll-out wins near the top; otherwise the way in from the bottom
    const out = Math.min(Math.max((vh * 0.34 - r.bottom) / (vh * 0.26), 0), 1);
    if (out > 0) { render(el, LINES[i], out, -1); return; }
    const q = Math.min(Math.max((vh * 0.94 - r.top) / (vh * 0.34), 0), 1);
    render(el, LINES[i], q, 1);
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// the host interface: on close, glide back to the first line and let
// the window wait for stillness before it shrinks
let recalling = false;
window.__recall = () => {
  if (scrollY < 2 || recalling) return recalling;
  recalling = true;
  let sy = scrollY, sv = 0, last = performance.now();
  const k = 110, d = 2 * Math.sqrt(k);
  const step = (now) => {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    sv += (-k * sy - d * sv) * dt;
    sy += sv * dt;
    if (sy < 1 && Math.abs(sv) < 8) { scrollTo(0, 0); recalling = false; return; }
    scrollTo(0, sy);
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  return true;
};
window.__busy = () => recalling;
</script>
</body>
</html>
