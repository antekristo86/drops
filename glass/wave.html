<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>wave lab</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: crosshair; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #tune {
    display: none; position: fixed; top: 20px; left: 20px; z-index: 5;
    background: rgba(0,0,0,0.82); border: 1px solid rgba(255,255,255,0.18);
    padding: 14px; width: 250px; max-height: 92vh; overflow: auto;
    font: 11px ui-monospace, monospace; color: #fff; backdrop-filter: blur(8px);
  }
  #tune.on { display: block; }
  #tune label { display: block; margin: 7px 0 1px; color: rgba(255,255,255,0.55); }
  #tune input { width: 100%; accent-color: #fff; }
  #tune .v { float: right; color: #fff; }
  #tune .btn { margin-top: 12px; cursor: pointer; color: rgba(255,255,255,0.6); }
  #tune .btn:hover { color: #fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tune"></div>
<script>
// the siri band on its own, out of the lens, so one thing at a time.
//
// a real ribbon in space. a centre line runs through x, y and z, a frame
// rolls along it, and the cloth is the strip that frame sweeps. it is
// walked in 3D and projected through a camera, so folds, crossings and
// perspective are the geometry doing its job, not effects laid on top.
//
// the colour stripes are printed across the cloth and never move. what
// reads as motion is the surface turning: where it faces you the stripes
// lie wide and thin, where it turns edge on the same strip lands in a few
// pixels and the seams burn. press D for the dials.
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: false });

const vsSrc = `
attribute vec2 p;
varying vec2 vUv;
void main() { vUv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`;

const fsSrc = `
precision highp float;
varying vec2 vUv;
uniform vec2 uRes;
uniform float uTime;
uniform float uLen, uHeight, uEye, uTilt;
uniform float uRot, uLagg, uBelly, uWob;
uniform float uThick, uGlow, uMelt, uGain, uSheen, uSheenW, uSpeed;

// stripes printed across the sheet. k = 0 red, k = 1 violet
vec3 spectral(float k) {
  vec3 red    = vec3(1.00, 0.22, 0.20);
  vec3 orange = vec3(1.00, 0.58, 0.18);
  vec3 gold   = vec3(1.00, 0.88, 0.42);
  vec3 green  = vec3(0.50, 0.96, 0.62);
  vec3 cyan   = vec3(0.32, 0.82, 1.00);
  vec3 blue   = vec3(0.36, 0.46, 1.00);
  vec3 a  = mix(red, orange, smoothstep(0.00, 0.22, k));
  vec3 b  = mix(a,   gold,   smoothstep(0.22, 0.42, k));
  vec3 cq = mix(b,   green,  smoothstep(0.42, 0.60, k));
  vec3 dq = mix(cq,  cyan,   smoothstep(0.60, 0.80, k));
  return   mix(dq,   blue,   smoothstep(0.80, 1.00, k));
}

void main() {
  float aspect = uRes.x / uRes.y;
  vec2 q = vec2((vUv.x - 0.5) * aspect, vUv.y - 0.5);
  float t = uTime * uSpeed;

  // a bedsheet held at its two short ends, turned in one steady motion.
  // the hands set the pace; the middle of the cloth trails behind them,
  // so the turn runs along the sheet as a wave. that lag is the wave
  float x = q.x / uLen;                        // -1..1 along the sheet
  float taperX = pow(max(1.0 - x * x, 0.0), uEye);
  if (taperX < 1e-3) { gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return; }
  float env = uHeight * (0.30 + 0.70 * taperX);

  float theta = t * uRot - uLagg * (1.0 - x * x)
              + uWob * sin(x * 2.1 - t * 0.33);
  float cs = cos(theta), sn = sin(theta);

  // the slack in the middle swings around the axis with the turn
  float centre = uTilt * x + uBelly * (1.0 - x * x) * sn;

  vec3 col = vec3(0.0);

  // six stripes at fixed positions across the cloth. the turn carries
  // them: face on they lie apart, translucent; edge on the whole print
  // lands on one line and burns white; through the flip the order
  // mirrors, which is why the top colour keeps changing. brightness is
  // flux over width, never painted
  for (int i = 0; i < 6; i++) {
    float k = float(i) / 5.0;
    float w = (k - 0.5) * 2.0;                 // place on the cloth

    float y = centre + env * w * cs;
    float z = w * sn;                          // toward or away from you

    float fat = k < 0.45 ? 1.45 : 1.0;
    float sigma = max(env * uThick * (0.10 + 0.90 * abs(cs)) * fat, 0.0012);
    float amp = 0.011 / sigma;                 // constant flux

    float d = q.y - y;
    float sg = d < 0.0 ? sigma * (1.0 + uMelt) : sigma;
    float core = exp(-d * d / (2.0 * sg * sg));
    float glow = exp(-d * d / (18.0 * sg * sg));
    float a = core + uGlow * glow * 0.30;

    // the far half of the cloth is seen through the near half
    float vis = 0.72 + 0.28 * smoothstep(-0.9, 0.9, z);

    vec3 tone = mix(spectral(k), vec3(1.0), 0.04);
    vec3 strand = tone * a * amp * vis * taperX * uGain * 0.5;
    col = 1.0 - (1.0 - col) * (1.0 - clamp(strand, 0.0, 1.0));
  }

  // the light on the cloth: a warm heart that rides the turning belly
  float xs = 0.45 * sin(t * 0.27) - 0.15;
  float sx = exp(-pow((x - xs) / max(uSheenW, 0.05), 2.0));
  float yg = centre + env * (-0.2) * cs;
  float sd = (q.y - yg) / max(env * 0.38, 1e-4);
  float sy = exp(-sd * sd);
  vec3 sheen = vec3(1.0, 0.97, 0.90) * sx * sy * uSheen * taperX;
  col = 1.0 - (1.0 - col) * (1.0 - clamp(sheen, 0.0, 1.0));

  // soften into white instead of clipping into neon
  col = 1.0 - exp(-col * 1.25);

  gl_FragColor = vec4(col, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSrc));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const uRes = gl.getUniformLocation(prog, 'uRes');
const uTime = gl.getUniformLocation(prog, 'uTime');

// press D for the panel
const DEFAULTS = {
  len: 0.38, height: 0.075, eye: 0.45, tilt: -0.02,
  rot: 0.55, lagg: 1.35, belly: 0.020, wob: 0.20,
  thick: 0.12, glow: 0.35, melt: 0.45, gain: 1.05,
  sheen: 0.45, sheenW: 0.45, speed: 1.0
};
const P = Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem('waveTune') || '{}'));
const U = {};
for (const k in DEFAULTS) U[k] = gl.getUniformLocation(prog, 'u' + k[0].toUpperCase() + k.slice(1));

function resize() {
  const dpr = Math.min(devicePixelRatio, 2);
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener('resize', resize);
resize();

function frame(t) {
  for (const k in DEFAULTS) gl.uniform1f(U[k], P[k]);
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, t * 0.001);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- tuning panel ----
const RANGES = {
  len: [0.1, 0.9, 0.01], height: [0.02, 0.25, 0.002], eye: [0.1, 2, 0.02],
  tilt: [-0.3, 0.3, 0.005],
  rot: [0, 3, 0.01], lagg: [0, 4, 0.02], belly: [0, 0.12, 0.001], wob: [0, 1.5, 0.01],
  thick: [0.05, 1.5, 0.01], glow: [0, 3, 0.02], melt: [0, 3, 0.02],
  gain: [0, 3, 0.02], sheen: [0, 2, 0.01], sheenW: [0.1, 2, 0.01], speed: [0, 3, 0.02]
};
const panel = document.getElementById('tune');
let html = '';
for (const k in DEFAULTS) {
  const [lo, hi, st] = RANGES[k];
  html += `<label>${k}<span class="v" id="v_${k}">${P[k]}</span></label>
           <input type="range" id="s_${k}" min="${lo}" max="${hi}" step="${st}" value="${P[k]}">`;
}
html += '<div class="btn" id="reset">reset</div><div class="btn" id="dump">copy values</div>';
panel.innerHTML = html;
for (const k in DEFAULTS) {
  const s = document.getElementById('s_' + k), v = document.getElementById('v_' + k);
  s.addEventListener('input', () => {
    P[k] = parseFloat(s.value); v.textContent = s.value;
    localStorage.setItem('waveTune', JSON.stringify(P));
  });
}
document.getElementById('reset').onclick = () => {
  localStorage.removeItem('waveTune'); location.reload();
};
document.getElementById('dump').onclick = () => {
  navigator.clipboard.writeText(JSON.stringify(P, null, 2));
};
addEventListener('keydown', e => {
  if (e.key === 'd' || e.key === 'D') panel.classList.toggle('on');
});
</script>
</body>
</html>
