<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>wave lab</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: crosshair; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #tune {
    display: none; position: fixed; top: 20px; left: 20px; z-index: 5;
    background: rgba(0,0,0,0.82); border: 1px solid rgba(255,255,255,0.18);
    padding: 14px; width: 250px; max-height: 92vh; overflow: auto;
    font: 11px ui-monospace, monospace; color: #fff; backdrop-filter: blur(8px);
  }
  #tune.on { display: block; }
  #tune label { display: block; margin: 7px 0 1px; color: rgba(255,255,255,0.55); }
  #tune input { width: 100%; accent-color: #fff; }
  #tune .v { float: right; color: #fff; }
  #tune .btn { margin-top: 12px; cursor: pointer; color: rgba(255,255,255,0.6); }
  #tune .btn:hover { color: #fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tune"></div>
<script>
// the siri band on its own, out of the lens, so one thing at a time.
//
// a real ribbon in space. a centre line runs through x, y and z, a frame
// rolls along it, and the cloth is the strip that frame sweeps. it is
// walked in 3D and projected through a camera, so folds, crossings and
// perspective are the geometry doing its job, not effects laid on top.
//
// the colour stripes are printed across the cloth and never move. what
// reads as motion is the surface turning: where it faces you the stripes
// lie wide and thin, where it turns edge on the same strip lands in a few
// pixels and the seams burn. press D for the dials.
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: false });

const vsSrc = `
attribute vec2 p;
varying vec2 vUv;
void main() { vUv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`;

const fsSrc = `
precision highp float;
varying vec2 vUv;
uniform vec2 uRes;
uniform float uTime;
uniform float uLen, uWidth, uCam;
uniform float uWaveY, uFreqY, uWaveZ, uFreqZ, uRoll, uFreqRoll, uSpeed;
uniform float uBands, uSeam, uFill, uGraze, uGain, uThick, uEnds;

// spectrum printed across the cloth. k = 0 red, k = 1 violet
vec3 spectral(float k) {
  vec3 red    = vec3(1.00, 0.22, 0.20);
  vec3 orange = vec3(1.00, 0.58, 0.18);
  vec3 gold   = vec3(1.00, 0.88, 0.42);
  vec3 green  = vec3(0.50, 0.96, 0.62);
  vec3 cyan   = vec3(0.32, 0.82, 1.00);
  vec3 blue   = vec3(0.36, 0.46, 1.00);
  vec3 a  = mix(red, orange, smoothstep(0.00, 0.22, k));
  vec3 b  = mix(a,   gold,   smoothstep(0.22, 0.42, k));
  vec3 cq = mix(b,   green,  smoothstep(0.42, 0.60, k));
  vec3 dq = mix(cq,  cyan,   smoothstep(0.60, 0.80, k));
  return   mix(dq,   blue,   smoothstep(0.80, 1.00, k));
}

// the centre line of the ribbon, in space
vec3 spine(float s, float t) {
  return vec3(
    s * uLen,
    uWaveY * sin(s * uFreqY - t),
    uWaveZ * sin(s * uFreqZ - t * 0.7 + 1.3)
  );
}

// its tangent, analytically
vec3 spineT(float s, float t) {
  return normalize(vec3(
    uLen,
    uWaveY * uFreqY * cos(s * uFreqY - t),
    uWaveZ * uFreqZ * cos(s * uFreqZ - t * 0.7 + 1.3)
  ));
}

// perspective. nearer is bigger, and that is the only reason it is
vec2 project(vec3 p) {
  return p.xy * (uCam / max(uCam - p.z, 0.05));
}

void main() {
  float aspect = uRes.x / uRes.y;
  vec2 pix = vec2((vUv.x - 0.5) * aspect, vUv.y - 0.5);
  float t = uTime * uSpeed;

  vec3 col = vec3(0.0);
  float sig = max(uThick, 0.001);

  // walk the ribbon along its length. every step is one rib of cloth,
  // projected to the screen as a segment; the pixel asks each rib whether
  // it lands on it and how much cloth it is looking at
  for (int i = 0; i < 96; i++) {
    float s = (float(i) / 95.0) * 2.0 - 1.0;

    vec3 C = spine(s, t);
    vec3 T = spineT(s, t);
    // a frame that rolls along the length. this is the twist, in 3D
    vec3 W0 = normalize(cross(T, vec3(0.0, 0.0, 1.0)));
    vec3 N0 = cross(W0, T);
    float roll = uRoll * sin(s * uFreqRoll - t * 1.1);
    vec3 W = W0 * cos(roll) + N0 * sin(roll);

    // the cloth narrows toward the two ends
    float taper = pow(max(1.0 - s * s, 0.0), uEnds);
    float hw = uWidth * taper;
    if (hw < 1e-5) continue;

    vec2 a = project(C - W * hw);
    vec2 b = project(C + W * hw);
    vec2 m = (a + b) * 0.5;
    vec2 e = (b - a) * 0.5;
    float len = length(e);
    if (len < 1e-5) continue;
    vec2 dir = e / len;

    vec2 rel = pix - m;
    float v = dot(rel, dir) / len;             // -1..1 across the cloth
    if (abs(v) > 1.0) continue;
    float perp = abs(rel.x * dir.y - rel.y * dir.x);

    // how much cloth this pixel is looking at. a short projected rib is
    // the same strip squeezed into fewer pixels, so it reads brighter.
    // nothing here is painted: it is the surface turning away
    float dens = 1.0 / max(len, 0.004);
    float kern = exp(-(perp * perp) / (sig * sig));

    float k = v * 0.5 + 0.5;
    float seam = abs(fract(k * uBands) - 0.5) * 2.0;
    float av = abs(v);

    vec3 hue = spectral(k);
    float body = uFill * (1.0 - av * av);
    float edge = uSeam * pow(seam, 5.0);
    float graze = uGraze * pow(av, 6.0);

    col += (hue * (body + edge) + vec3(1.0, 0.99, 0.97) * graze)
         * kern * dens * taper;
  }

  gl_FragColor = vec4(col * uGain * 0.02, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSrc));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const uRes = gl.getUniformLocation(prog, 'uRes');
const uTime = gl.getUniformLocation(prog, 'uTime');

// press D for the panel
const DEFAULTS = {
  len: 0.34, width: 0.075, cam: 1.6,
  waveY: 0.030, freqY: 2.0, waveZ: 0.090, freqZ: 1.6,
  roll: 0.90, freqRoll: 1.8, speed: 0.55,
  bands: 6, seam: 0.30, fill: 0.60, graze: 0.55,
  gain: 2.6, thick: 0.007, ends: 0.35
};
const P = Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem('waveTune') || '{}'));
const U = {};
for (const k in DEFAULTS) U[k] = gl.getUniformLocation(prog, 'u' + k[0].toUpperCase() + k.slice(1));

function resize() {
  const dpr = Math.min(devicePixelRatio, 2);
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener('resize', resize);
resize();

function frame(t) {
  for (const k in DEFAULTS) gl.uniform1f(U[k], P[k]);
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, t * 0.001);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- tuning panel ----
const RANGES = {
  len: [0.1, 0.9, 0.01], width: [0.005, 0.3, 0.002], cam: [0.4, 6, 0.05],
  waveY: [0, 0.25, 0.002], freqY: [0, 8, 0.05],
  waveZ: [0, 0.4, 0.005], freqZ: [0, 8, 0.05],
  roll: [0, 3.14, 0.02], freqRoll: [0, 8, 0.05], speed: [0, 3, 0.02],
  bands: [2, 14, 1], seam: [0, 2, 0.01], fill: [0, 2, 0.01], graze: [0, 2, 0.01],
  gain: [0, 4, 0.02], thick: [0.0005, 0.02, 0.0005], ends: [0.05, 2, 0.05]
};
const panel = document.getElementById('tune');
let html = '';
for (const k in DEFAULTS) {
  const [lo, hi, st] = RANGES[k];
  html += `<label>${k}<span class="v" id="v_${k}">${P[k]}</span></label>
           <input type="range" id="s_${k}" min="${lo}" max="${hi}" step="${st}" value="${P[k]}">`;
}
html += '<div class="btn" id="reset">reset</div><div class="btn" id="dump">copy values</div>';
panel.innerHTML = html;
for (const k in DEFAULTS) {
  const s = document.getElementById('s_' + k), v = document.getElementById('v_' + k);
  s.addEventListener('input', () => {
    P[k] = parseFloat(s.value); v.textContent = s.value;
    localStorage.setItem('waveTune', JSON.stringify(P));
  });
}
document.getElementById('reset').onclick = () => {
  localStorage.removeItem('waveTune'); location.reload();
};
document.getElementById('dump').onclick = () => {
  navigator.clipboard.writeText(JSON.stringify(P, null, 2));
};
addEventListener('keydown', e => {
  if (e.key === 'd' || e.key === 'D') panel.classList.toggle('on');
});
</script>
</body>
</html>
