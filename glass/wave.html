<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>wave lab</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: crosshair; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #tune {
    display: none; position: fixed; top: 20px; left: 20px; z-index: 5;
    background: rgba(0,0,0,0.82); border: 1px solid rgba(255,255,255,0.18);
    padding: 14px; width: 250px; max-height: 92vh; overflow: auto;
    font: 11px ui-monospace, monospace; color: #fff; backdrop-filter: blur(8px);
  }
  #tune.on { display: block; }
  #tune label { display: block; margin: 7px 0 1px; color: rgba(255,255,255,0.55); }
  #tune input { width: 100%; accent-color: #fff; }
  #tune .v { float: right; color: #fff; }
  #tune .btn { margin-top: 12px; cursor: pointer; color: rgba(255,255,255,0.6); }
  #tune .btn:hover { color: #fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tune"></div>
<script>
// the siri band on its own, out of the lens, so one thing at a time.
//
// a real ribbon in space. a centre line runs through x, y and z, a frame
// rolls along it, and the cloth is the strip that frame sweeps. it is
// walked in 3D and projected through a camera, so folds, crossings and
// perspective are the geometry doing its job, not effects laid on top.
//
// the colour stripes are printed across the cloth and never move. what
// reads as motion is the surface turning: where it faces you the stripes
// lie wide and thin, where it turns edge on the same strip lands in a few
// pixels and the seams burn. press D for the dials.
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: false });

const vsSrc = `
attribute vec2 p;
varying vec2 vUv;
void main() { vUv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`;

const fsSrc = `
precision highp float;
varying vec2 vUv;
uniform vec2 uRes;
uniform float uTime;
uniform float uLen, uHeight, uEye, uTilt;
uniform float uRoll, uLag, uWob, uWobFreq;
uniform float uThick, uEdge, uBack, uFill, uGain, uSpeed;

// spectrum around the roll. k = 0 red, k = 1 violet
vec3 spectral(float k) {
  vec3 red    = vec3(1.00, 0.22, 0.20);
  vec3 orange = vec3(1.00, 0.58, 0.18);
  vec3 gold   = vec3(1.00, 0.88, 0.42);
  vec3 green  = vec3(0.50, 0.96, 0.62);
  vec3 cyan   = vec3(0.32, 0.82, 1.00);
  vec3 blue   = vec3(0.36, 0.46, 1.00);
  vec3 a  = mix(red, orange, smoothstep(0.00, 0.22, k));
  vec3 b  = mix(a,   gold,   smoothstep(0.22, 0.42, k));
  vec3 cq = mix(b,   green,  smoothstep(0.42, 0.60, k));
  vec3 dq = mix(cq,  cyan,   smoothstep(0.60, 0.80, k));
  return   mix(dq,   blue,   smoothstep(0.80, 1.00, k));
}

void main() {
  float aspect = uRes.x / uRes.y;
  vec2 q = vec2((vUv.x - 0.5) * aspect, vUv.y - 0.5);
  float t = uTime * uSpeed;

  float x = q.x / uLen;                        // -1..1 along the band
  if (abs(x) > 1.15) { gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return; }

  // the band is a flattened tube, fattest in the middle, closing to a
  // point at both ends. this eye shape IS its silhouette, nothing drawn
  float env = uHeight * pow(max(1.0 - x * x, 0.0), uEye);
  if (env < 1e-4) { gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return; }

  // the centre line barely moves: a fixed tilt and a shallow breath
  float centre = uTilt * x + 0.25 * uHeight * sin(x * 1.3 - t * 0.4) * uWob;

  // the roll. this is the whole motion: the cloth turns around its long
  // axis, phase running along the length, so the turn travels as a wave
  float roll = t * uRoll + x * uLag + uWob * sin(x * uWobFreq - t * 0.7);

  vec3 col = vec3(0.0);

  // six colours printed around the tube. each one is carried around by
  // the roll: over the top, wide and faint through the front, under the
  // bottom, dim across the back. at the silhouette the surface stands
  // edge-on, the print bunches up, and the line burns. that is why the
  // edges are bright and the middle is translucent
  for (int i = 0; i < 6; i++) {
    float k = float(i) / 5.0;
    float th = float(i) * 1.04720 + roll;      // 6 colours around the circle
    float sn = sin(th), cs = cos(th);

    float y = centre + env * sn;               // projected height on screen
    float ac = abs(cs);
    float ht = max(env * uThick * (0.35 + 0.65 * ac), 0.0015);

    float d = (q.y - y) / ht;
    float a = exp(-d * d);

    // foreshortening: edge-on packs the same print into fewer pixels
    float dens = mix(1.0, 1.0 / max(ac, 0.10), uEdge);
    // the far side of the tube is seen through the cloth. the handover
    // is soft, a hard switch prints vertical seams where the roll flips
    float vis = mix(uBack, 1.0, smoothstep(-0.25, 0.25, cs));

    vec3 strand = spectral(k) * a * dens * vis * 0.40;
    col = 1.0 - (1.0 - col) * (1.0 - clamp(strand, 0.0, 1.0));
  }

  // the cloth itself, a faint white body inside the silhouette
  float vy = (q.y - centre) / env;
  float body = max(1.0 - vy * vy, 0.0);
  col = 1.0 - (1.0 - col) * (1.0 - vec3(1.0, 0.99, 0.97) * body * body * uFill);

  float ends = smoothstep(1.15, 0.75, abs(x));
  gl_FragColor = vec4(col * uGain * ends, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSrc));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const uRes = gl.getUniformLocation(prog, 'uRes');
const uTime = gl.getUniformLocation(prog, 'uTime');

// press D for the panel
const DEFAULTS = {
  len: 0.46, height: 0.055, eye: 0.55, tilt: -0.03,
  roll: 0.85, lag: 0.9, wob: 0.35, wobFreq: 1.6,
  thick: 0.30, edge: 0.75, back: 0.28, fill: 0.14,
  gain: 1.0, speed: 1.0
};
const P = Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem('waveTune') || '{}'));
const U = {};
for (const k in DEFAULTS) U[k] = gl.getUniformLocation(prog, 'u' + k[0].toUpperCase() + k.slice(1));

function resize() {
  const dpr = Math.min(devicePixelRatio, 2);
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener('resize', resize);
resize();

function frame(t) {
  for (const k in DEFAULTS) gl.uniform1f(U[k], P[k]);
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, t * 0.001);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- tuning panel ----
const RANGES = {
  len: [0.1, 0.9, 0.01], height: [0.02, 0.3, 0.002], eye: [0.2, 2, 0.02],
  tilt: [-0.3, 0.3, 0.005],
  roll: [0, 3, 0.02], lag: [0, 6, 0.05], wob: [0, 2, 0.02], wobFreq: [0, 8, 0.05],
  thick: [0.05, 1, 0.01], edge: [0, 1, 0.01], back: [0, 1, 0.01],
  fill: [0, 0.6, 0.005], gain: [0, 3, 0.02], speed: [0, 3, 0.02]
};
const panel = document.getElementById('tune');
let html = '';
for (const k in DEFAULTS) {
  const [lo, hi, st] = RANGES[k];
  html += `<label>${k}<span class="v" id="v_${k}">${P[k]}</span></label>
           <input type="range" id="s_${k}" min="${lo}" max="${hi}" step="${st}" value="${P[k]}">`;
}
html += '<div class="btn" id="reset">reset</div><div class="btn" id="dump">copy values</div>';
panel.innerHTML = html;
for (const k in DEFAULTS) {
  const s = document.getElementById('s_' + k), v = document.getElementById('v_' + k);
  s.addEventListener('input', () => {
    P[k] = parseFloat(s.value); v.textContent = s.value;
    localStorage.setItem('waveTune', JSON.stringify(P));
  });
}
document.getElementById('reset').onclick = () => {
  localStorage.removeItem('waveTune'); location.reload();
};
document.getElementById('dump').onclick = () => {
  navigator.clipboard.writeText(JSON.stringify(P, null, 2));
};
addEventListener('keydown', e => {
  if (e.key === 'd' || e.key === 'D') panel.classList.toggle('on');
});
</script>
</body>
</html>
