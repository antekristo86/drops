<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>wave lab</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: crosshair; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #tune {
    display: none; position: fixed; top: 20px; left: 20px; z-index: 5;
    background: rgba(0,0,0,0.82); border: 1px solid rgba(255,255,255,0.18);
    padding: 14px; width: 250px; max-height: 92vh; overflow: auto;
    font: 11px ui-monospace, monospace; color: #fff; backdrop-filter: blur(8px);
  }
  #tune.on { display: block; }
  #tune label { display: block; margin: 7px 0 1px; color: rgba(255,255,255,0.55); }
  #tune input { width: 100%; accent-color: #fff; }
  #tune .v { float: right; color: #fff; }
  #tune .btn { margin-top: 12px; cursor: pointer; color: rgba(255,255,255,0.6); }
  #tune .btn:hover { color: #fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tune"></div>
<script>
// the siri band on its own, out of the lens, so one thing at a time.
//
// it is a flag. a ribbon lying in space, waving on the spot. fixed colour
// stripes are printed across its width; they never travel. what travels is
// a twist along its length. where the flag turns edge on, the stripes
// foreshorten into each other and the seams between them burn; where it
// faces you they spread out and go transparent. press D for the dials.
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: false });

const vsSrc = `
attribute vec2 p;
varying vec2 vUv;
void main() { vUv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`;

const fsSrc = `
precision highp float;
varying vec2 vUv;
uniform vec2 uRes;
uniform float uTime;
uniform float uLen, uWidth, uSag;
uniform float uTwist, uTwistFreq, uSpeed, uSway, uSwayFreq;
uniform float uBands, uSeam, uFill, uGraze, uGain, uFalloff;

// spectrum across the width of the flag. k = 0 red, k = 1 violet
vec3 spectral(float k) {
  vec3 red    = vec3(1.00, 0.22, 0.20);
  vec3 orange = vec3(1.00, 0.58, 0.18);
  vec3 gold   = vec3(1.00, 0.88, 0.42);
  vec3 green  = vec3(0.50, 0.96, 0.62);
  vec3 cyan   = vec3(0.32, 0.82, 1.00);
  vec3 blue   = vec3(0.36, 0.46, 1.00);
  vec3 a  = mix(red, orange, smoothstep(0.00, 0.22, k));
  vec3 b  = mix(a,   gold,   smoothstep(0.22, 0.42, k));
  vec3 cq = mix(b,   green,  smoothstep(0.42, 0.60, k));
  vec3 dq = mix(cq,  cyan,   smoothstep(0.60, 0.80, k));
  return   mix(dq,   blue,   smoothstep(0.80, 1.00, k));
}

void main() {
  float aspect = uRes.x / uRes.y;
  vec2 q = vec2((vUv.x - 0.5) * aspect, vUv.y - 0.5);

  float x = q.x / uLen;                       // -1..1 along the flag
  if (abs(x) > 1.3) { gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return; }

  // the flag waves on the spot: it does not travel across the screen.
  // a slow sway for the centre line, and a twist running along the length
  float t = uTime * uSpeed;
  float centre = uSag * x
               + uSway * sin(x * uSwayFreq - t * 0.9);
  float tw = uTwist * sin(x * uTwistFreq - t);

  // how much of the width you actually see. face on it is the full width,
  // edge on it collapses to a line. this is the whole effect
  float fore = abs(cos(tw));
  float taper = pow(max(1.0 - x * x, 0.0), 0.35);   // the flag has ends
  float hw = uWidth * fore * taper;
  if (hw < 1e-5) { gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return; }

  float v = (q.y - centre) / hw;             // -1..1 across the flag
  float av = abs(v);
  if (av > 1.0) { gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return; }

  // fixed stripes printed on the cloth. they never move on their own
  float k = (v * 0.5 + 0.5);
  vec3 hue = spectral(k);

  // the seams between colours. one screen pixel covers more of the cloth
  // when the flag is edge on, so the seams pile up and burn there
  float p = k * uBands;
  float seam = abs(fract(p) - 0.5) * 2.0;      // 1 at a seam, 0 mid stripe
  float dens = 1.0 / max(fore, 0.06);          // foreshortening

  float body = uFill * pow(1.0 - av * av, uFalloff);
  float edge = uSeam * pow(seam, 6.0);
  float graze = uGraze * pow(av, 5.0);         // the silhouette of the cloth

  vec3 col = hue * (body + edge) * dens + vec3(1.0, 0.99, 0.97) * graze * dens * 0.5;
  col *= uGain * taper;

  gl_FragColor = vec4(col, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSrc));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const uRes = gl.getUniformLocation(prog, 'uRes');
const uTime = gl.getUniformLocation(prog, 'uTime');

// press D for the panel
const DEFAULTS = {
  len: 0.34, width: 0.075, sag: 0.03,
  twist: 1.35, twistFreq: 2.20, speed: 0.60, sway: 0.030, swayFreq: 1.60,
  bands: 6.0, seam: 0.30, fill: 0.60, graze: 0.55, gain: 1.2, falloff: 0.60
};
const P = Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem('waveTune') || '{}'));
const U = {};
for (const k in DEFAULTS) U[k] = gl.getUniformLocation(prog, 'u' + k[0].toUpperCase() + k.slice(1));

function resize() {
  const dpr = Math.min(devicePixelRatio, 2);
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener('resize', resize);
resize();

function frame(t) {
  for (const k in DEFAULTS) gl.uniform1f(U[k], P[k]);
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, t * 0.001);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- tuning panel ----
const RANGES = {
  len: [0.1, 0.9, 0.01], width: [0.005, 0.3, 0.002], sag: [-0.2, 0.2, 0.005],
  twist: [0, 3.14, 0.02], twistFreq: [0, 8, 0.05], speed: [0, 3, 0.02],
  sway: [0, 0.2, 0.002], swayFreq: [0, 8, 0.05],
  bands: [2, 14, 1], seam: [0, 2, 0.01], fill: [0, 2, 0.01],
  graze: [0, 2, 0.01], gain: [0, 3, 0.02], falloff: [0.1, 4, 0.05]
};
const panel = document.getElementById('tune');
let html = '';
for (const k in DEFAULTS) {
  const [lo, hi, st] = RANGES[k];
  html += `<label>${k}<span class="v" id="v_${k}">${P[k]}</span></label>
           <input type="range" id="s_${k}" min="${lo}" max="${hi}" step="${st}" value="${P[k]}">`;
}
html += '<div class="btn" id="reset">reset</div><div class="btn" id="dump">copy values</div>';
panel.innerHTML = html;
for (const k in DEFAULTS) {
  const s = document.getElementById('s_' + k), v = document.getElementById('v_' + k);
  s.addEventListener('input', () => {
    P[k] = parseFloat(s.value); v.textContent = s.value;
    localStorage.setItem('waveTune', JSON.stringify(P));
  });
}
document.getElementById('reset').onclick = () => {
  localStorage.removeItem('waveTune'); location.reload();
};
document.getElementById('dump').onclick = () => {
  navigator.clipboard.writeText(JSON.stringify(P, null, 2));
};
addEventListener('keydown', e => {
  if (e.key === 'd' || e.key === 'D') panel.classList.toggle('on');
});
</script>
</body>
</html>
