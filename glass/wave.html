<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>wave lab</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: crosshair; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #tune {
    display: none; position: fixed; top: 20px; left: 20px; z-index: 5;
    background: rgba(0,0,0,0.82); border: 1px solid rgba(255,255,255,0.18);
    padding: 14px; width: 250px; max-height: 92vh; overflow: auto;
    font: 11px ui-monospace, monospace; color: #fff; backdrop-filter: blur(8px);
  }
  #tune.on { display: block; }
  #tune label { display: block; margin: 7px 0 1px; color: rgba(255,255,255,0.55); }
  #tune input { width: 100%; accent-color: #fff; }
  #tune .v { float: right; color: #fff; }
  #tune .btn { margin-top: 12px; cursor: pointer; color: rgba(255,255,255,0.6); }
  #tune .btn:hover { color: #fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tune"></div>
<script>
// the siri band on its own, out of the lens, so one thing at a time.
//
// a real ribbon in space. a centre line runs through x, y and z, a frame
// rolls along it, and the cloth is the strip that frame sweeps. it is
// walked in 3D and projected through a camera, so folds, crossings and
// perspective are the geometry doing its job, not effects laid on top.
//
// the colour stripes are printed across the cloth and never move. what
// reads as motion is the surface turning: where it faces you the stripes
// lie wide and thin, where it turns edge on the same strip lands in a few
// pixels and the seams burn. press D for the dials.
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: false });

const vsSrc = `
attribute vec2 p;
varying vec2 vUv;
void main() { vUv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`;

const fsSrc = `
precision highp float;
varying vec2 vUv;
uniform vec2 uRes;
uniform float uTime;
uniform float uLen, uHeight, uEye, uTilt;
uniform float uRot, uTwist, uSlack, uBelly;
uniform float uHueSpread, uFill, uEdge, uGlow, uGain, uSpeed;

// the foil's spectrum. k = 0 red, k = 1 violet
vec3 spectral(float k) {
  vec3 red    = vec3(1.00, 0.22, 0.20);
  vec3 orange = vec3(1.00, 0.58, 0.18);
  vec3 gold   = vec3(1.00, 0.88, 0.42);
  vec3 green  = vec3(0.50, 0.96, 0.62);
  vec3 cyan   = vec3(0.32, 0.82, 1.00);
  vec3 blue   = vec3(0.36, 0.46, 1.00);
  vec3 a  = mix(red, orange, smoothstep(0.00, 0.22, k));
  vec3 b  = mix(a,   gold,   smoothstep(0.22, 0.42, k));
  vec3 cq = mix(b,   green,  smoothstep(0.42, 0.60, k));
  vec3 dq = mix(cq,  cyan,   smoothstep(0.60, 0.80, k));
  return   mix(dq,   blue,   smoothstep(0.80, 1.00, k));
}

// iridescence: the colour is the angle. nothing is printed on the sheet;
// turn it and the spectrum sweeps across it
vec3 foil(float ang) {
  return spectral(0.5 + 0.5 * sin(ang));
}

void main() {
  float aspect = uRes.x / uRes.y;
  vec2 q = vec2((vUv.x - 0.5) * aspect, vUv.y - 0.5);
  float t = uTime * uSpeed;

  // one sheet, held at its two short ends and turned in a steady motion.
  // uRot is the hands, uTwist the standing twist between them, uSlack the
  // cloth trailing behind, uBelly the slack middle swinging around
  float x = q.x / uLen;                        // -1..1 along the sheet
  float taperX = pow(max(1.0 - x * x, 0.0), uEye);
  if (taperX < 1e-3) { gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return; }
  float env = uHeight * (0.25 + 0.75 * taperX);

  float theta = t * uRot + x * uTwist
              + uSlack * sin(x * 1.3 - t * 0.45)
              - 0.6 * (1.0 - x * x);
  float cs = cos(theta);
  float acs = abs(cs);

  float centre = uTilt * x + uBelly * (1.0 - x * x) * sin(theta);

  // where this pixel sits across the cloth. outside the two hems there is
  // no cloth, only their glow
  float W = env * max(acs, 0.035);             // projected half-width
  float w = (q.y - centre) / W;                // -1..1 across the sheet

  // the colour of the surface right here: the twist angle, shifted a
  // little across the width, so the sweep runs diagonally over the cloth
  vec3 hueF = foil(theta + w * uHueSpread);

  vec3 col = vec3(0.0);

  if (abs(w) < 1.0) {
    // the face: translucent, brightest where it stands near edge-on and
    // packs its light into a narrow strip. flux over width, not paint
    float grazing = 1.0 - acs;
    float faceAmp = uFill * (0.45 + 0.55 * grazing * grazing) / max(acs, 0.10);
    float across = 1.0 - w * w * 0.35;         // slightly denser mid-cloth
    col += hueF * faceAmp * across * 0.55;
  }

  // the two hems: thin bright lines of the same foil colour, burning
  // hardest where the sheet turns edge-on and both fall onto one line
  float dTop = q.y - (centre + env * cs);
  float dBot = q.y - (centre - env * cs);
  float sig  = 0.0018 + 0.010 * env * acs;
  float hem  = exp(-dTop * dTop / (2.0 * sig * sig))
             + exp(-dBot * dBot / (2.0 * sig * sig));
  float hemGlow = exp(-dTop * dTop / (30.0 * sig * sig))
                + exp(-dBot * dBot / (30.0 * sig * sig));
  float burn = 1.0 / max(acs, 0.10);
  vec3 hueT = foil(theta + uHueSpread);
  vec3 hueB = foil(theta - uHueSpread);
  col += (hueT * exp(-dTop * dTop / (2.0 * sig * sig))
        + hueB * exp(-dBot * dBot / (2.0 * sig * sig))) * uEdge * 0.35 * burn;
  col += (hueT + hueB) * 0.5 * hemGlow * uGlow * 0.06 * burn;

  col *= taperX * uGain;

  // soften into white instead of clipping into neon
  col = 1.0 - exp(-col * 1.25);

  gl_FragColor = vec4(col, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSrc));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const uRes = gl.getUniformLocation(prog, 'uRes');
const uTime = gl.getUniformLocation(prog, 'uTime');

// press D for the panel
const DEFAULTS = {
  len: 0.38, height: 0.075, eye: 0.45, tilt: -0.02,
  rot: 0.45, twist: 1.4, slack: 0.35, belly: 0.020,
  hueSpread: 1.1, fill: 0.70, edge: 1.0, glow: 1.2,
  gain: 1.0, speed: 1.0
};
const P = Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem('waveTune') || '{}'));
const U = {};
for (const k in DEFAULTS) U[k] = gl.getUniformLocation(prog, 'u' + k[0].toUpperCase() + k.slice(1));

function resize() {
  const dpr = Math.min(devicePixelRatio, 2);
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener('resize', resize);
resize();

function frame(t) {
  for (const k in DEFAULTS) gl.uniform1f(U[k], P[k]);
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, t * 0.001);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- tuning panel ----
const RANGES = {
  len: [0.1, 0.9, 0.01], height: [0.02, 0.25, 0.002], eye: [0.1, 2, 0.02],
  tilt: [-0.3, 0.3, 0.005],
  rot: [0, 3, 0.01], twist: [0, 6, 0.02], slack: [0, 2, 0.02], belly: [0, 0.12, 0.001],
  hueSpread: [0, 3, 0.02], fill: [0, 2, 0.01], edge: [0, 3, 0.02], glow: [0, 3, 0.02],
  gain: [0, 3, 0.02], speed: [0, 3, 0.02]
};
const panel = document.getElementById('tune');
let html = '';
for (const k in DEFAULTS) {
  const [lo, hi, st] = RANGES[k];
  html += `<label>${k}<span class="v" id="v_${k}">${P[k]}</span></label>
           <input type="range" id="s_${k}" min="${lo}" max="${hi}" step="${st}" value="${P[k]}">`;
}
html += '<div class="btn" id="reset">reset</div><div class="btn" id="dump">copy values</div>';
panel.innerHTML = html;
for (const k in DEFAULTS) {
  const s = document.getElementById('s_' + k), v = document.getElementById('v_' + k);
  s.addEventListener('input', () => {
    P[k] = parseFloat(s.value); v.textContent = s.value;
    localStorage.setItem('waveTune', JSON.stringify(P));
  });
}
document.getElementById('reset').onclick = () => {
  localStorage.removeItem('waveTune'); location.reload();
};
document.getElementById('dump').onclick = () => {
  navigator.clipboard.writeText(JSON.stringify(P, null, 2));
};
addEventListener('keydown', e => {
  if (e.key === 'd' || e.key === 'D') panel.classList.toggle('on');
});
</script>
</body>
</html>
