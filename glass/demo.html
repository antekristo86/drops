<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>liquid glass</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: crosshair; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// liquid glass. the ios 27 siri bubble as one fragment shader:
// a bowed slot lens, refraction with chromatic split, dark glass fading
// to clear, and the siri wave: a hot core with spectral wings.
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: false });

// ---- background: a lockscreen-ish surface drawn once ----
const tex2d = document.createElement('canvas');
const ctx = tex2d.getContext('2d');
let dpr = 1;

function drawBackground() {
  const w = tex2d.width, h = tex2d.height;
  const g = ctx.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, '#2a2438');
  g.addColorStop(0.5, '#171522');
  g.addColorStop(1, '#0b0a12');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  const r = ctx.createRadialGradient(w * 0.3, h * 0.2, 0, w * 0.3, h * 0.2, h * 0.9);
  r.addColorStop(0, 'rgba(255,214,170,0.16)');
  r.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = r;
  ctx.fillRect(0, 0, w, h);

  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  ctx.fillStyle = 'rgba(255,246,235,0.92)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `600 ${h * 0.26}px -apple-system, 'Helvetica Neue', sans-serif`;
  ctx.fillText(`${hh}:${mm}`, w / 2, h * 0.46);
  ctx.font = `500 ${h * 0.042}px -apple-system, 'Helvetica Neue', sans-serif`;
  ctx.fillStyle = 'rgba(255,246,235,0.65)';
  const date = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  ctx.fillText(date, w / 2, h * 0.3);
}

const vsSrc = `
attribute vec2 p;
varying vec2 vUv;
void main() { vUv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`;

const fsSrc = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uRes;
uniform float uTime;

// slot geometry, uv units (y-normalized)
const float HL  = 0.125;   // half length of the straight core
const float RAD = 0.058;   // half height
const float BOW = 0.014;   // downward belly of the centerline

// centerline of the bowed slot: dips by BOW in the middle
float spineY(float px) {
  float t = clamp(px / HL, -1.0, 1.0);
  return -BOW * (1.0 - t * t);
}

// signed distance to the bowed slot
float slotSDF(vec2 q, vec2 c) {
  vec2 p = q - c;
  p.y -= spineY(p.x);
  vec2 k = vec2(max(abs(p.x) - HL, 0.0), p.y);
  return length(k) - RAD;
}

void main() {
  float aspect = uRes.x / uRes.y;
  vec2 q = vec2(vUv.x * aspect, vUv.y);
  vec2 c = vec2(0.5 * aspect, 0.84);

  float d = slotSDF(q, c);
  vec3 col = texture2D(uTex, vec2(vUv.x, 1.0 - vUv.y)).rgb;

  if (d < 0.0) {
    float depth = -d / RAD;                     // 0 rim, 1 spine
    // sdf gradient as refraction normal
    float e = 0.002;
    vec2 n = normalize(vec2(
      slotSDF(q + vec2(e, 0.0), c) - slotSDF(q - vec2(e, 0.0), c),
      slotSDF(q + vec2(0.0, e), c) - slotSDF(q - vec2(0.0, e), c)
    ) + 1e-6);

    float bend = pow(1.0 - depth, 3.0);
    vec2 base = vUv;
    vec2 shift = n / vec2(aspect, 1.0) * bend * RAD * 0.5;

    float rr = texture2D(uTex, vec2(base.x - shift.x * 1.12, 1.0 - (base.y - shift.y * 1.12))).r;
    float gg = texture2D(uTex, vec2(base.x - shift.x,        1.0 - (base.y - shift.y))).g;
    float bb = texture2D(uTex, vec2(base.x - shift.x * 0.88, 1.0 - (base.y - shift.y * 0.88))).b;
    col = vec3(rr, gg, bb);

    // dark glass: solid toward the top of the slot, fading to clear below
    float vert = clamp((q.y - (c.y + spineY(q.x - c.x) - RAD)) / (2.0 * RAD), 0.0, 1.0);
    float darkness = smoothstep(0.35, 0.95, vert);
    col = mix(col, col * 0.06, darkness * 0.92);

    // ---- the siri wave ----
    // rides the spine, undulates gently. hot narrow core inside a wide
    // soft bloom. warm left wing, cool right wing, white heart
    float px = q.x - c.x;
    float tx = clamp(px / HL, -1.2, 1.2);
    // one gentle hump that slowly travels, not a sine train
    float wy = c.y + spineY(px) - RAD * 0.05
             + RAD * 0.16 * sin(px * 7.0 + uTime * 0.5)
             + RAD * 0.045 * sin(px * 15.0 - uTime * 0.33);
    float dy = q.y - wy;

    float endMask = smoothstep(1.15, 0.55, abs(tx));
    float core  = exp(-pow(dy / (RAD * 0.06), 2.0)) * endMask;
    // bloom bleeds further down than up, like light settling
    float spreadDown = dy < 0.0 ? RAD * 0.75 : RAD * 0.38;
    float bloom = exp(-pow(dy / spreadDown, 2.0)) * endMask;

    float drift = sin(uTime * 0.25) * 0.35;
    vec3 warm = vec3(1.0, 0.52, 0.18);
    vec3 cool = vec3(0.35, 0.62, 1.0);
    vec3 wing = mix(warm, cool, smoothstep(-1.0, 1.0, tx + drift));
    vec3 heart = mix(wing, vec3(1.0), 0.75);

    float breathe = 0.8 + 0.2 * sin(uTime * 0.6);
    col += wing * bloom * 0.5 * breathe;
    col += heart * core * 1.35 * breathe;

    // faint spectral rim inside the glass
    float band = smoothstep(0.16, 0.02, depth) * smoothstep(0.0, 0.02, depth);
    col += wing * band * 0.1;
  }

  // drop shadow just outside
  float sh = smoothstep(0.05, 0.0, d) * smoothstep(-0.02, 0.0, d);
  col *= 1.0 - sh * 0.4;

  // hairline rim: lit from above, fades out at the sides
  float topLight = clamp((q.y - c.y) / RAD * 0.5 + 0.6, 0.05, 1.0);
  float rim = smoothstep(0.0035, 0.0, abs(d)) * 0.5 * topLight;
  col += vec3(rim);

  gl_FragColor = vec4(col, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSrc));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
gl.linkProgram(prog);
gl.useProgram(prog);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

const uTex = gl.getUniformLocation(prog, 'uTex');
const uRes = gl.getUniformLocation(prog, 'uRes');
const uTime = gl.getUniformLocation(prog, 'uTime');

function resize() {
  dpr = Math.min(devicePixelRatio, 2);
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  tex2d.width = canvas.width;
  tex2d.height = canvas.height;
  gl.viewport(0, 0, canvas.width, canvas.height);
  drawBackground();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, tex2d);
}
addEventListener('resize', resize);
resize();

function frame(t) {
  gl.uniform1i(uTex, 0);
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, t * 0.001);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
