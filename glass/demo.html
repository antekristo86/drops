<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>liquid glass</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: crosshair; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// liquid glass. the ios 27 siri lens as one fragment shader:
// refraction with chromatic split, a prismatic rim, a moving sheen.
// the lens follows the cursor with inertia.
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: false });

// ---- background: a lockscreen-ish surface drawn once ----
const tex2d = document.createElement('canvas');
const ctx = tex2d.getContext('2d');
let dpr = 1;

const bgImg = new Image();
bgImg.src = './bg.png';
bgImg.onload = () => resize();

function drawBackground() {
  const w = tex2d.width, h = tex2d.height;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);
  if (!bgImg.complete || !bgImg.naturalWidth) return;
  // cover fit
  const s = Math.max(w / bgImg.naturalWidth, h / bgImg.naturalHeight);
  const dw = bgImg.naturalWidth * s, dh = bgImg.naturalHeight * s;
  ctx.drawImage(bgImg, (w - dw) / 2, (h - dh) / 2, dw, dh);
}

const vsSrc = `
attribute vec2 p;
varying vec2 vUv;
void main() { vUv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`;

const fsSrc = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uRes;
uniform float uTime;
uniform vec2 uLens;      // lens center, uv
uniform float uR;        // lens radius, uv (y-normalized)
uniform vec2 uVel;       // lens velocity, squashes the bubble

// a rectangle with rounded corners. exact sdf
float lensField(vec2 q, vec2 c, float r) {
  vec2 halfSize = vec2(r * 2.1, r * 0.72);
  float rad = halfSize.y;   // always half the height: clean semicircular ends
  vec2 d2 = abs(q - c) - (halfSize - rad);
  return length(max(d2, vec2(0.0))) + min(max(d2.x, d2.y), 0.0) - rad;
}

vec3 hue(float t) {
  return clamp(abs(mod(t * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
}

void main() {
  float aspect = uRes.x / uRes.y;
  vec2 q = vec2(vUv.x * aspect, vUv.y);
  vec2 c = vec2(uLens.x * aspect, uLens.y);

  // first-order distance: field over gradient magnitude. keeps the rim,
  // shadow and bands equally thick all the way around
  float e = 0.0015;
  float F = lensField(q, c, uR);
  vec2 g = vec2(
    lensField(q + vec2(e, 0.0), c, uR) - lensField(q - vec2(e, 0.0), c, uR),
    lensField(q + vec2(0.0, e), c, uR) - lensField(q - vec2(0.0, e), c, uR)
  ) / (2.0 * e);
  float gm = max(length(g), 1e-3);
  float d = F / gm;
  vec3 col = texture2D(uTex, vec2(vUv.x, 1.0 - vUv.y)).rgb;

  if (d < 0.0) {
    // inside the lens: refract. strength peaks at the rim, calm center
    float depth = clamp(-d / uR, 0.0, 1.0);     // 1 center, 0 rim
    vec2 n = g / gm;
    float bend = pow(1.0 - depth, 3.0) * smoothstep(0.0, 0.045, depth); // rim-heavy, crisp wall
    float mag = 0.09 * uR;                       // center magnification

    vec2 base = vUv - (q - c) / vec2(aspect, 1.0) * mag * depth;
    vec2 shift = n / vec2(aspect, 1.0) * bend * uR * 0.26;

    float rr = texture2D(uTex, vec2(base.x - shift.x * 1.12, 1.0 - (base.y - shift.y * 1.12))).r;
    float gg = texture2D(uTex, vec2(base.x - shift.x,        1.0 - (base.y - shift.y))).g;
    float bb = texture2D(uTex, vec2(base.x - shift.x * 0.88, 1.0 - (base.y - shift.y * 0.88))).b;
    col = vec3(rr, gg, bb);

    // slight glass tint toward the rim
    col *= mix(1.0, 0.9, bend);

    // prismatic sliver: a thin spectral arc, only in a moving window,
    // a whisper not a rainbow
    float band = smoothstep(0.14, 0.02, depth) * smoothstep(0.0, 0.02, depth);
    float ang = atan(q.y - c.y, q.x - c.x);
    vec3 iri = hue(ang * 0.35 + uTime * 0.04);
    float window = smoothstep(0.45, 1.0, sin(ang - uTime * 0.35));
    float window2 = smoothstep(0.7, 1.0, sin(ang * 1.0 + 2.6 + uTime * 0.22));
    col += iri * band * (window * 0.22 + window2 * 0.12);

    // sheen: soft white highlight top edge, subtle
    float topness = clamp((q.y - c.y) / uR, -1.0, 1.0);
    col += vec3(1.0) * band * smoothstep(0.45, 1.0, topness) * 0.18;
  }

  // glass barely casts. all that survives is a whisper of darkening
  // hugging the outer edge, where the body bends light away from the plate
  float outside = step(0.0, d);
  float seam = smoothstep(0.012, 0.0, d) * outside;
  col *= 1.0 - seam * seam * 0.22;

  // hairline rim
  float rim = smoothstep(0.0014, 0.0, abs(d));
  col += vec3(rim) * 0.35;

  gl_FragColor = vec4(col, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSrc));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
gl.linkProgram(prog);
gl.useProgram(prog);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

const uTex = gl.getUniformLocation(prog, 'uTex');
const uRes = gl.getUniformLocation(prog, 'uRes');
const uTime = gl.getUniformLocation(prog, 'uTime');
const uLens = gl.getUniformLocation(prog, 'uLens');
const uRU = gl.getUniformLocation(prog, 'uR');
const uVel = gl.getUniformLocation(prog, 'uVel');

// step 1: the lens sits still, top center
let lx = 0.5, ly = 0.5, vx = 0, vy = 0;

function resize() {
  dpr = Math.min(devicePixelRatio, 2);
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  tex2d.width = canvas.width;
  tex2d.height = canvas.height;
  gl.viewport(0, 0, canvas.width, canvas.height);
  drawBackground();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, tex2d);
}
addEventListener('resize', resize);
resize();

let last = performance.now();
function frame(t) {
  const now = performance.now();
  last = now;

  gl.uniform1i(uTex, 0);
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, t * 0.001);
  gl.uniform2f(uLens, lx, ly);
  gl.uniform1f(uRU, 0.13);
  gl.uniform2f(uVel, vx, vy);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
