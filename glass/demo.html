<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>liquid glass</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: crosshair; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #tune {
    display: none; position: fixed; top: 20px; left: 20px; z-index: 5;
    background: rgba(0,0,0,0.82); border: 1px solid rgba(255,255,255,0.18);
    padding: 14px; width: 250px; max-height: 92vh; overflow: auto;
    font: 11px ui-monospace, monospace; color: #fff; backdrop-filter: blur(8px);
  }
  #tune.on { display: block; }
  #tune label { display: block; margin: 7px 0 1px; color: rgba(255,255,255,0.55); }
  #tune input { width: 100%; accent-color: #fff; }
  #tune .v { float: right; color: #fff; }
  #tune .btn { margin-top: 12px; cursor: pointer; color: rgba(255,255,255,0.6); }
  #tune .btn:hover { color: #fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tune"></div>
<script>
// liquid glass. the ios 27 siri lens as one fragment shader:
// refraction with chromatic split, a prismatic rim, a moving sheen.
// the lens follows the cursor with inertia.
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: false });

// ---- background: the artwork, drawn into a canvas the shader reads ----
const tex2d = document.createElement('canvas');
const ctx = tex2d.getContext('2d');
let dpr = 1;

const bgImg = new Image();
let bgReady = false;
bgImg.onload = () => { bgReady = true; resize(); };
bgImg.src = 'bg.png';

function drawBackground() {
  const w = tex2d.width, h = tex2d.height;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);
  if (!bgReady) return;
  // cover fit, so the artwork never letterboxes behind the lens
  const s = Math.max(w / bgImg.width, h / bgImg.height);
  const dw = bgImg.width * s, dh = bgImg.height * s;
  ctx.drawImage(bgImg, (w - dw) / 2, (h - dh) / 2, dw, dh);
}

const vsSrc = `
attribute vec2 p;
varying vec2 vUv;
void main() { vUv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`;

const fsSrc = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uRes;
uniform float uTime;
uniform vec2  uPan;      // background drift
uniform float uScale;    // grows on hover
// glass, figma's model: every dial does exactly one thing
uniform float uLightAngle, uLightPower;   // where the light stands, how hard
uniform float uRefraction;                // how far the ray is pushed
uniform float uDepth;                     // body thickness, drives magnification
uniform float uDispersion;                // spectral split
uniform float uFrost;                     // milkiness
uniform float uSplay;                     // how sharply the rim flares
// this piece specifically
uniform float uShapeW, uShapeH, uSmoke, uSmokePos;
uniform float uWaveAmp, uWaveGirth, uWaveInt, uWaveSat, uWaveBend;
uniform float uShadow, uRimTint, uWaveFreq, uWaveSpeed, uWaveCore, uWaveReach, uCaustic, uCausticSize, uCausticGap;
uniform vec2 uLens;      // lens center, uv
uniform float uR;        // lens radius, uv (y-normalized)
uniform vec2 uVel;       // lens velocity, squashes the bubble

// a rectangle with rounded corners. exact sdf
float lensField(vec2 q, vec2 c, float r) {
  vec2 halfSize = vec2(r * uShapeW, r * uShapeH) * uScale;
  float rad = halfSize.y;   // always half the height: clean semicircular ends
  vec2 d2 = abs(q - c) - (halfSize - rad);
  return length(max(d2, vec2(0.0))) + min(max(d2.x, d2.y), 0.0) - rad;
}

// the surface of the glass as a height field. analytic and smooth
// everywhere, so its slope never jumps. the distance field is fine for
// the silhouette, but its gradient flips along the medial axis of any
// straight edge, and that seam prints straight through the body
float domeH(vec2 p, vec2 c, float r) {
  vec2 hs = vec2(r * uShapeW, r * uShapeH) * uScale;
  vec2 u = (p - c) / hs;
  float rr = pow(pow(abs(u.x), 4.0) + pow(abs(u.y), 4.0), 0.25);
  // 1 - r^n. flat through the middle, steepest right at the rim, and
  // that slope stays finite. a hemisphere would run to infinity there
  // and tear; a cosine would flatten out and give no splay at all
  float t = min(rr, 1.0);
  return 1.0 - pow(t, uSplay);
}

// spectrum by wavelength. k = 0 red, k = 1 violet
vec3 spectral(float k) {
  vec3 red    = vec3(1.00, 0.22, 0.20);
  vec3 orange = vec3(1.00, 0.58, 0.18);
  vec3 gold   = vec3(1.00, 0.88, 0.42);
  vec3 green  = vec3(0.50, 0.96, 0.62);
  vec3 cyan   = vec3(0.32, 0.82, 1.00);
  vec3 blue   = vec3(0.36, 0.46, 1.00);
  vec3 a  = mix(red, orange, smoothstep(0.00, 0.22, k));
  vec3 b  = mix(a,   gold,   smoothstep(0.22, 0.42, k));
  vec3 cq = mix(b,   green,  smoothstep(0.42, 0.60, k));
  vec3 dq = mix(cq,  cyan,   smoothstep(0.60, 0.80, k));
  return   mix(dq,   blue,   smoothstep(0.80, 1.00, k));
}

// a travelling wave, not a static arc. two components move at
// different speeds so crests drift and meet instead of marching, and
// the whole thing breathes
float waveSpine(float x, float t) {
  float ph = t * uWaveSpeed;
  // one clean wave with its own octave on top. simple ratios read as
  // harmony; incommensurate ones never repeat and read as noise
  float a = sin(x * uWaveFreq - ph);
  float b = sin(x * uWaveFreq * 2.0 + ph * 0.5 + 0.8) * 0.16;
  float breathe = 0.90 + 0.10 * sin(t * 0.31);
  return uWaveAmp * (a + b) * 0.9 * breathe;
}

// the wave is a beam, not a stack of stripes. a white hot filament with
// the spectrum fanning off it: warm above, cool below. dense at the
// core, graceful as it thins out. everything here is additive light
vec3 waveField(vec2 w, float t) {
  float ends = smoothstep(1.32, 0.25, abs(w.x));
  if (ends <= 0.001) return vec3(0.0);

  float base = waveSpine(w.x * 2.3, t);
  float dy = w.y - base;

  // the beam is fuller in the middle of its run and thins toward the caps
  // the fan opens and closes along the run, so the bands drift against
  // each other instead of travelling as one rigid ribbon
  float breath = 1.0 + 0.10 * sin(w.x * 1.5 - t * 0.30) + 0.04 * sin(w.x * 3.0 + t * 0.19);
  float girth = (uWaveGirth + uWaveGirth * 0.53 * smoothstep(1.1, 0.0, abs(w.x + 0.15))) * breath;
  float u = dy / girth;                       // 0 core, ±1 edge of the beam
  float au = abs(u);

  // wavelength by direction: gold rising off the top, cyan sinking below
  float k = clamp(0.5 - u * 0.42 + 0.04 * sin(t * 0.2), 0.0, 1.0);
  vec3 hue = spectral(k);

  // colour takes over almost immediately off the filament
  float sat = smoothstep(0.01, uWaveSat, au);
  vec3 tone = mix(vec3(1.0, 0.99, 0.97), hue, sat);

  // two dials: how fat the filament runs, how far the colour reaches out
  float bodyG = exp(-u * u * 1.15);
  float tail  = 0.34 / (1.0 + au * au * uWaveReach);
  float core  = exp(-u * u / max(uWaveCore * uWaveCore, 1e-5));

  vec3 acc = tone * (bodyG * 1.15 + tail * 0.7);
  acc += vec3(1.0, 0.99, 0.97) * core * 0.9;
  return acc * ends;
}

void main() {
  float aspect = uRes.x / uRes.y;
  vec2 q = vec2(vUv.x * aspect, vUv.y);
  vec2 c = vec2(uLens.x * aspect, uLens.y);

  // first-order distance: field over gradient magnitude. keeps the rim,
  // shadow and bands equally thick all the way around
  float e = 0.0015;
  float F = lensField(q, c, uR);
  vec2 g = vec2(
    lensField(q + vec2(e, 0.0), c, uR) - lensField(q - vec2(e, 0.0), c, uR),
    lensField(q + vec2(0.0, e), c, uR) - lensField(q - vec2(0.0, e), c, uR)
  ) / (2.0 * e);
  float gm = max(length(g), 1e-3);
  float d = F / gm;
  vec3 col = texture2D(uTex, vec2(vUv.x + uPan.x, 1.0 - vUv.y + uPan.y)).rgb;

  if (d < 0.0) {
    // ---- the lens ----
    // one idea: push the background outward, nothing at the centre,
    // hardest at the rim, plus the magnification a thick body gives.
    // all of it in body space, so it stays smooth everywhere. distance
    // field gradients and height normals both tear on straight edges
    vec2 hs = vec2(uR * uShapeW, uR * uShapeH) * uScale;
    vec2 u = (q - c) / hs;
    float r = min(pow(pow(abs(u.x), 6.0) + pow(abs(u.y), 6.0), 1.0 / 6.0), 1.0);
    vec2 dir = length(u) > 1e-5 ? normalize(u) : vec2(0.0);

    float push = pow(r, uSplay) * uRefraction * 0.42;
    float mag  = (1.0 - r * r) * uDepth * 0.30;

    vec2 base = vUv - (q - c) / vec2(aspect, 1.0) * mag;
    vec2 off  = dir * push * hs / vec2(aspect, 1.0);

    // spectral spread: sample across a run of wavelengths and weight each
    // by its colour. three channels at three offsets gives hard red and
    // blue edges; a weighted fan gives the soft glow real glass has.
    // note the minus: pushing the sample inward bulges the image outward
    vec3 acc3 = vec3(0.0);
    vec3 wsum = vec3(0.0);
    for (int i = 0; i < 9; i++) {
      float k = float(i) / 8.0;
      float sc = 1.0 + uDispersion * 9.0 * (k - 0.5);
      float a2 = float(i) * 0.698;
      vec2 j = vec2(cos(a2), sin(a2)) * uFrost * 0.05 * (0.3 + 0.7 * k);
      vec2 uvS = base - off * sc + j;
      vec3 samp = texture2D(uTex, vec2(uvS.x + uPan.x, 1.0 - uvS.y + uPan.y)).rgb;
      vec3 w = spectral(k) + 0.35;
      acc3 += samp * w;
      wsum += w;
    }
    col = acc3 / max(wsum, vec3(0.001));

    float depth = clamp(1.0 - r, 0.0, 1.0);
    float bend = r * r;

    // the wave sits inside the body, so the refracted ray finds it and
    // it warps and splits along with everything else
    // it floats mid body, so it only takes a fraction of the full bend.
    // the whole path would fold it back on itself at the caps
    // the beam sits behind the glass, so the same bend carries it. push
    // this too far and it tears where the displacement jumps, so the
    // amount is a dial
    // same sign as the background, or the two bends cancel and the beam
    // reads as if it were sitting on top of the glass
    vec2 wpos = u - dir * push * uWaveBend * 2.2;
    vec3 wv = waveField(wpos, uTime);

    // slight glass tint toward the rim
    col *= mix(1.0, 0.9, bend);

    // the body is smoked at the top and clears toward the bottom.
    // the fade sits just above center, where the wave will ride
    float hh = uR * uShapeH * uScale;
    float up = (q.y - c.y) / hh;                 // -1 bottom, +1 top
    // wide and eased twice. a narrow ramp reads as an overlay, a long
    // one reads as tinted material. never fully black, the body keeps depth
    float smoke = smoothstep(-0.95 + uSmokePos, 1.0 + uSmokePos, up);
    smoke = smoke * smoke * (3.0 - 2.0 * smoke);
    smoke = smoke * smoke * (3.0 - 2.0 * smoke);
    col = mix(col, col * 0.10, smoke * uSmoke);

    col += wv * uWaveInt;

    // the only colour here comes from the dispersion above. no painted
    // spectrum: the reference keeps its rainbow in the wave, not the rim
    float band = smoothstep(0.14, 0.02, depth) * smoothstep(0.0, 0.02, depth);
    float topness = clamp((q.y - c.y) / uR, -1.0, 1.0);
    col += vec3(1.0) * band * smoothstep(0.45, 1.0, topness) * 0.14;
  }

  // glass casts, but barely: a wide low-density veil below the body and
  // a slightly denser seam at the contact edge. present, never a stain
  float outside = step(0.0, d);
  // ---- caustic ----
  // not a painted gradient. this is the beam's image, projected through
  // the lens onto whatever lies below. the further it travels the more
  // it defocuses, and each wavelength lands a little apart, so colour
  // appears at the edges of that image the way it does under real glass
  {
    vec2 hsC = vec2(uR * uShapeW, uR * uShapeH) * uScale;
    // light falls straight down out of the body, so the pool is measured
    // from the bottom line. measuring from the outline makes the isolines
    // the shape of the lens, and the silhouette prints itself into the light
    float travel = ((c.y - hsC.y * (1.0 + uCausticGap)) - q.y) / max(hsC.y, 1e-4);
    if (travel > -0.6 && uCaustic > 0.001) {
      float xn = (q.x - c.x) / hsC.x;
      float sz = max(uCausticSize, 0.15);
      // wide feather against the body. a hard mask is what puts an edge on top
      float clear = smoothstep(-hsC.y * 0.55, hsC.y * 0.05, d);
      float rise  = smoothstep(-0.05, 0.30, travel);
      float defocus = (0.10 + max(travel, 0.0) * 0.70) * sz;
      // quadratic falloff. linear keeps too much light far out and the
      // pool turns into a field
      float reach = exp(-travel * travel * 1.6 / (sz * sz));
      float ends  = smoothstep(1.25, 0.15, abs(xn));

      // the beam drives the brightness, the wavelength drives the colour,
      // off the same spectrum the wave uses. each wavelength focuses at its
      // own depth, and that separation is the only reason a caustic has colour
      float srcY = waveSpine(xn * 2.3, uTime);
      vec3 acc = vec3(0.0);
      float wsum = 0.0;
      for (int i = 0; i < 7; i++) {
        float k = float(i) / 6.0;
        float focus = (k - 0.5) * uDispersion * 46.0;
        float dy = travel - 0.22 - focus;
        float prof = exp(-dy * dy / (defocus * defocus));
        vec3 bs = waveField(vec2(xn * 0.95 + focus * 0.4, srcY), uTime);
        float lum = max(max(bs.r, bs.g), bs.b);
        acc  += spectral(k) * lum * prof;
        wsum += prof;
      }
      acc /= max(wsum, 0.001);
      col += acc * reach * ends * rise * clear * uCaustic * 1.6;
    }
  }

  // a normal drop shadow: small offset down, wide soft blur, very low
  // density. an exponential falloff keeps it from reading as a cloud
  float dCast = lensField(q - vec2(0.0, -0.22 * uR), c, uR) / gm;
  float veil = exp(-max(dCast, 0.0) * 11.0) * outside;
  col *= 1.0 - veil * uShadow;

  // the rim is not a stroke. it is the lit edge of a body with thickness:
  // a bright band where the surface turns into the light, fading to
  // nothing on the far side, plus a soft inner falloff for the wall
  vec3 L = normalize(vec3(cos(uLightAngle), sin(uLightAngle), 0.42));
  vec3 nrm = normalize(vec3(g / gm, 0.5));
  float facing = clamp(dot(nrm, L), 0.0, 1.0);

  // widths in pixels, not uv. keeps the edge a hairline at any resolution
  float px = 1.0 / uRes.y;
  float band  = smoothstep(px * 2.0, 0.0, abs(d));       // the lit edge
  float wall  = smoothstep(px * 16.0, 0.0, abs(d));      // thickness behind it
  float lit   = pow(facing, 4.0);                        // direct specular

  // light entering the top pools along the lower wall and escapes there.
  // that reflection is brighter than the specular above it
  float down  = clamp(-dot(nrm, L), 0.0, 1.0);
  float tir   = pow(down, 1.6);

  // the edge is lit by the wave behind it and carries its colour
  float hwR = uR * uShapeW * uScale;
  float hhR = uR * uShapeH * uScale;
  // the beam throws light sideways through the body. the wall above it
  // catches the warm half, the wall below catches the cool half, and it
  // burns brightest where the beam runs closest
  float wx = clamp((q.x - c.x) / hwR, -1.4, 1.4);
  float wyy = (q.y - c.y) / hhR;
  float sideD = wyy - waveSpine(wx * 2.3, uTime);
  float kSide = clamp(0.5 - sideD * 1.15, 0.0, 1.0);
  vec3 wcol = spectral(kSide);
  float prox = exp(-sideD * sideD * 3.2) * smoothstep(1.35, 0.2, abs(wx));
  vec3 rimCol = mix(vec3(1.0, 0.99, 0.96), wcol, clamp(prox * uRimTint, 0.0, 1.0));

  // and the wall itself glows a little where the beam meets it
  col += wcol * band * prox * uRimTint * 0.5;
  col += wcol * wall * prox * uRimTint * 0.14;

  col += rimCol * band * lit * uLightPower * 0.35;
  col += rimCol * band * tir * uLightPower * 0.62;
  col += rimCol * wall * tir * uLightPower * 0.12;
  col += vec3(0.85, 0.9, 1.0) * wall * lit * 0.04;
  col += vec3(1.0) * band * 0.04;

  gl_FragColor = vec4(col, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSrc));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
gl.linkProgram(prog);
gl.useProgram(prog);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

const uTex = gl.getUniformLocation(prog, 'uTex');
const uRes = gl.getUniformLocation(prog, 'uRes');
const uTime = gl.getUniformLocation(prog, 'uTime');
const uPan = gl.getUniformLocation(prog, 'uPan');
const uScale = gl.getUniformLocation(prog, 'uScale');

// press D for the panel
const DEFAULTS = {
  lightAngle: 2.0, lightPower: 0.8, refraction: 0.85, depth: 1.0,
  dispersion: 0.016, frost: 0.0, splay: 3.5,
  shapeW: 2.70, shapeH: 0.68, smoke: 0.90, smokePos: 0.00,
  waveAmp: 0.28, waveGirth: 0.185, waveInt: 0.95, waveSat: 0.08, waveBend: 0.45,
  shadow: 0.14, rimTint: 0.45, waveFreq: 0.9, waveSpeed: 0.45, waveCore: 0.105, waveReach: 2.8, caustic: 0.5, causticSize: 1.0, causticGap: 0.0
};
const P = Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem('glassTune') || '{}'));
const U = {};
for (const k in DEFAULTS) U[k] = gl.getUniformLocation(prog, 'u' + k[0].toUpperCase() + k.slice(1));
const uLens = gl.getUniformLocation(prog, 'uLens');
const uRU = gl.getUniformLocation(prog, 'uR');
const uVel = gl.getUniformLocation(prog, 'uVel');

let lx = 0.5, ly = 0.5, vx = 0, vy = 0;

// hover grows the body, drag moves it. hit test uses the live shape,
// so it stays correct when the dials change
let scale = 1, scaleT = 1, scaleV = 0;
let dragging = false, grabX = 0, grabY = 0;

function overLens(mx, my) {
  const R = 0.13;
  const hw = R * P.shapeW * scale, hh = R * P.shapeH * scale;
  const ar = canvas.width / canvas.height;
  return Math.abs((mx - lx) * ar) < hw + 0.02 && Math.abs(my - ly) < hh + 0.02;
}

addEventListener('pointermove', e => {
  const mx = e.clientX / innerWidth, my = 1 - e.clientY / innerHeight;
  if (dragging) {
    lx = mx - grabX;
    ly = my - grabY;
    lx = Math.max(0.02, Math.min(0.98, lx));
    ly = Math.max(0.02, Math.min(0.98, ly));
    return;
  }
  const inside = overLens(mx, my);
  scaleT = inside ? 1.12 : 1;
  canvas.style.cursor = inside ? 'grab' : 'crosshair';
});

canvas.addEventListener('pointerdown', e => {
  const mx = e.clientX / innerWidth, my = 1 - e.clientY / innerHeight;
  if (!overLens(mx, my)) return;
  dragging = true;
  grabX = mx - lx;
  grabY = my - ly;
  canvas.setPointerCapture(e.pointerId);
  canvas.style.cursor = 'grabbing';
});
addEventListener('pointerup', () => {
  if (!dragging) return;
  dragging = false;
  canvas.style.cursor = 'grab';
});
addEventListener('pointerleave', () => { scaleT = 1; });

function resize() {
  dpr = Math.min(devicePixelRatio, 2);
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  tex2d.width = canvas.width;
  tex2d.height = canvas.height;
  gl.viewport(0, 0, canvas.width, canvas.height);
  drawBackground();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, tex2d);
}
addEventListener('resize', resize);
resize();

let last = performance.now();
function frame(t) {
  const now = performance.now();
  last = now;

  scaleV += (scaleT - scale) * 0.045 - scaleV * 0.26;
  scale += scaleV;
  gl.uniform1f(uScale, scale);
  for (const k in DEFAULTS) gl.uniform1f(U[k], P[k]);
  // the artwork drifts slowly, so its light-to-dark edge crosses the lens
  const T = t * 0.001;
  gl.uniform2f(uPan, 0.0, 0.0);
  gl.uniform1i(uTex, 0);
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, t * 0.001);
  gl.uniform2f(uLens, lx, ly);
  gl.uniform1f(uRU, 0.13);
  gl.uniform2f(uVel, vx, vy);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- tuning panel ----
const RANGES = {
  lightAngle: [0, 6.28, 0.02], lightPower: [0, 2, 0.02], refraction: [0, 2.5, 0.01],
  depth: [0, 2, 0.02], dispersion: [0, 0.06, 0.001], frost: [0, 1, 0.01],
  splay: [1.5, 10, 0.1],
  shapeW: [0.5, 4, 0.05], shapeH: [0.2, 2, 0.02], smoke: [0, 1, 0.01],
  smokePos: [-0.8, 0.8, 0.02], waveAmp: [0, 0.9, 0.01], waveGirth: [0.02, 0.5, 0.005],
  waveInt: [0, 3, 0.02], waveSat: [0.02, 0.8, 0.01], waveBend: [0, 2, 0.05],
  shadow: [0, 0.6, 0.01], rimTint: [0, 3, 0.05],
  waveFreq: [0.5, 8, 0.1], waveSpeed: [0, 2.5, 0.05],
  waveCore: [0.02, 0.5, 0.005], waveReach: [0.3, 12, 0.1], caustic: [0, 2, 0.02],
  causticSize: [0.3, 3, 0.05], causticGap: [-1.5, 2, 0.05]
};
const panel = document.getElementById('tune');
panel.innerHTML = Object.keys(RANGES).map(k => {
  const [mn, mx, st] = RANGES[k];
  return `<label>${k.toUpperCase()}<span class="v" id="v_${k}">${P[k]}</span></label>
          <input type="range" id="i_${k}" min="${mn}" max="${mx}" step="${st}" value="${P[k]}">`;
}).join('') + '<div class="btn" id="copy">COPY VALUES</div><div class="btn" id="reset">RESET</div>';

for (const k in RANGES) {
  document.getElementById('i_' + k).addEventListener('input', e => {
    P[k] = parseFloat(e.target.value);
    document.getElementById('v_' + k).textContent = P[k];
    localStorage.setItem('glassTune', JSON.stringify(P));
  });
}
document.getElementById('copy').addEventListener('click', () => {
  navigator.clipboard.writeText(JSON.stringify(P));
  document.getElementById('copy').textContent = 'COPIED';
  setTimeout(() => { document.getElementById('copy').textContent = 'COPY VALUES'; }, 1200);
});
document.getElementById('reset').addEventListener('click', () => {
  Object.assign(P, DEFAULTS);
  localStorage.removeItem('glassTune');
  for (const k in RANGES) {
    document.getElementById('i_' + k).value = P[k];
    document.getElementById('v_' + k).textContent = P[k];
  }
});
addEventListener('keydown', e => {
  if (e.key === 'd' || e.key === 'D') panel.classList.toggle('on');
});
</script>
</body>
</html>
