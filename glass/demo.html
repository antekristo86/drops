<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>liquid glass</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: crosshair; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #tune {
    display: none; position: fixed; top: 20px; left: 20px; z-index: 5;
    background: rgba(0,0,0,0.82); border: 1px solid rgba(255,255,255,0.18);
    padding: 14px; width: 250px; max-height: 92vh; overflow: auto;
    font: 11px ui-monospace, monospace; color: #fff; backdrop-filter: blur(8px);
  }
  #tune.on { display: block; }
  #tune label { display: block; margin: 7px 0 1px; color: rgba(255,255,255,0.55); }
  #tune input { width: 100%; accent-color: #fff; }
  #tune .v { float: right; color: #fff; }
  #tune .btn { margin-top: 12px; cursor: pointer; color: rgba(255,255,255,0.6); }
  #tune .btn:hover { color: #fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tune"></div>
<script>
// liquid glass. the ios 27 siri lens as one fragment shader:
// refraction with chromatic split, a prismatic rim, a moving sheen.
// the lens follows the cursor with inertia.
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: false });

// ---- background: a lockscreen-ish surface drawn once ----
const tex2d = document.createElement('canvas');
const ctx = tex2d.getContext('2d');
let dpr = 1;

const bgImg = new Image();
bgImg.src = './bg.png';
bgImg.onload = () => resize();

function drawBackground() {
  const w = tex2d.width, h = tex2d.height;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);
  if (!bgImg.complete || !bgImg.naturalWidth) return;
  // cover fit
  const s = Math.max(w / bgImg.naturalWidth, h / bgImg.naturalHeight);
  const dw = bgImg.naturalWidth * s, dh = bgImg.naturalHeight * s;
  ctx.drawImage(bgImg, (w - dw) / 2, (h - dh) / 2, dw, dh);
}

const vsSrc = `
attribute vec2 p;
varying vec2 vUv;
void main() { vUv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`;

const fsSrc = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uRes;
uniform float uTime;
uniform vec2  uPan;      // background drift
uniform float uScale;    // grows on hover
uniform float uShapeW, uShapeH, uThick, uMagnify, uSlope, uDisp;
uniform float uSmoke, uSmokePos, uWaveAmp, uWaveGirth, uWaveInt, uWaveSat;
uniform float uRim, uTir, uShadow, uRimTint, uWaveBend;
uniform vec2 uLens;      // lens center, uv
uniform float uR;        // lens radius, uv (y-normalized)
uniform vec2 uVel;       // lens velocity, squashes the bubble

// a rectangle with rounded corners. exact sdf
float lensField(vec2 q, vec2 c, float r) {
  vec2 halfSize = vec2(r * uShapeW, r * uShapeH) * uScale;
  float rad = halfSize.y;   // always half the height: clean semicircular ends
  vec2 d2 = abs(q - c) - (halfSize - rad);
  return length(max(d2, vec2(0.0))) + min(max(d2.x, d2.y), 0.0) - rad;
}

// spectrum by wavelength. k = 0 red, k = 1 violet
vec3 spectral(float k) {
  vec3 red    = vec3(1.00, 0.22, 0.20);
  vec3 orange = vec3(1.00, 0.58, 0.18);
  vec3 gold   = vec3(1.00, 0.88, 0.42);
  vec3 green  = vec3(0.50, 0.96, 0.62);
  vec3 cyan   = vec3(0.32, 0.82, 1.00);
  vec3 blue   = vec3(0.36, 0.46, 1.00);
  vec3 a  = mix(red, orange, smoothstep(0.00, 0.22, k));
  vec3 b  = mix(a,   gold,   smoothstep(0.22, 0.42, k));
  vec3 cq = mix(b,   green,  smoothstep(0.42, 0.60, k));
  vec3 dq = mix(cq,  cyan,   smoothstep(0.60, 0.80, k));
  return   mix(dq,   blue,   smoothstep(0.80, 1.00, k));
}

// the arc the light travels: one long sweep, crest left of centre
float waveSpine(float x, float t) {
  return uWaveAmp * sin(x * 0.95 + 1.9 + t * 0.22)
       + uWaveAmp * 0.25 * sin(x * 2.10 - 0.6 - t * 0.15);
}

// the wave is a beam, not a stack of stripes. a white hot filament with
// the spectrum fanning off it: warm above, cool below. dense at the
// core, graceful as it thins out. everything here is additive light
vec3 waveField(vec2 w, float t) {
  float ends = smoothstep(1.32, 0.25, abs(w.x));
  if (ends <= 0.001) return vec3(0.0);

  float base = waveSpine(w.x * 2.3, t);
  float dy = w.y - base;

  // the beam is fuller in the middle of its run and thins toward the caps
  float girth = uWaveGirth + uWaveGirth * 0.53 * smoothstep(1.1, 0.0, abs(w.x + 0.15));
  float u = dy / girth;                       // 0 core, ±1 edge of the beam
  float au = abs(u);

  // wavelength by direction: gold rising off the top, cyan sinking below
  float k = clamp(0.5 - u * 0.42 + 0.04 * sin(t * 0.2), 0.0, 1.0);
  vec3 hue = spectral(k);

  // colour takes over almost immediately off the filament
  float sat = smoothstep(0.01, uWaveSat, au);
  vec3 tone = mix(vec3(1.0, 0.99, 0.97), hue, sat);

  // dense inside, long graceful tail outside
  float bodyG = exp(-u * u * 1.15);
  float tail  = 0.34 / (1.0 + au * au * 2.8);
  float core  = exp(-u * u * 90.0);

  vec3 acc = tone * (bodyG * 1.15 + tail * 0.7);
  acc += vec3(1.0, 0.99, 0.97) * core * 0.9;
  return acc * ends;
}

void main() {
  float aspect = uRes.x / uRes.y;
  vec2 q = vec2(vUv.x * aspect, vUv.y);
  vec2 c = vec2(uLens.x * aspect, uLens.y);

  // first-order distance: field over gradient magnitude. keeps the rim,
  // shadow and bands equally thick all the way around
  float e = 0.0015;
  float F = lensField(q, c, uR);
  vec2 g = vec2(
    lensField(q + vec2(e, 0.0), c, uR) - lensField(q - vec2(e, 0.0), c, uR),
    lensField(q + vec2(0.0, e), c, uR) - lensField(q - vec2(0.0, e), c, uR)
  ) / (2.0 * e);
  float gm = max(length(g), 1e-3);
  float d = F / gm;
  vec3 col = texture2D(uTex, vec2(vUv.x + uPan.x, 1.0 - vUv.y + uPan.y)).rgb;

  if (d < 0.0) {
    // the body is a real lens. a dome sits over the outline: flat in the
    // middle, steep at the rim. its slope bends the ray by snell, the
    // thickness decides how far that bent ray travels before it exits
    float depth = clamp(-d / uR, 0.0, 1.0);     // 1 centre, 0 rim
    vec2 n = g / gm;
    float bend = pow(1.0 - depth, 3.0) * smoothstep(0.0, 0.045, depth);

    float t01 = 1.0 - depth;                     // 0 centre, 1 rim
    float dome = sqrt(max(0.0, 1.0 - t01 * t01));       // thickness profile
    // slope rises smoothly instead of standing up at the wall. a spike
    // there makes the background snap rather than flow
    float slope = smoothstep(0.0, 1.0, t01) * t01 * uSlope;
    vec3 N = normalize(vec3(n * slope, dome * 0.85 + 0.22));
    vec3 I = vec3(0.0, 0.0, -1.0);

    float thick = uThick * uR * dome;
    // three indices: glass splits the spectrum on its own
    vec3 Rr = refract(I, N, 0.662 - uDisp);
    vec3 Rg = refract(I, N, 0.662);
    vec3 Rb = refract(I, N, 0.662 + uDisp * 1.2);

    // thickness also magnifies what sits behind the middle
    vec2 mid = vUv - (q - c) / vec2(aspect, 1.0) * uMagnify * dome;
    vec2 pan = vec2(uPan.x, -uPan.y);

    vec2 ur = mid + Rr.xy / max(0.3, abs(Rr.z)) * thick / vec2(aspect, 1.0);
    vec2 ug = mid + Rg.xy / max(0.3, abs(Rg.z)) * thick / vec2(aspect, 1.0);
    vec2 ub = mid + Rb.xy / max(0.3, abs(Rb.z)) * thick / vec2(aspect, 1.0);

    float rr = texture2D(uTex, vec2(ur.x + uPan.x, 1.0 - ur.y + uPan.y)).r;
    float gg = texture2D(uTex, vec2(ug.x + uPan.x, 1.0 - ug.y + uPan.y)).g;
    float bb = texture2D(uTex, vec2(ub.x + uPan.x, 1.0 - ub.y + uPan.y)).b;
    col = vec3(rr, gg, bb);

    // the wave sits inside the body, so the refracted ray finds it and
    // it warps and splits along with everything else
    float hwW = uR * uShapeW * uScale;
    float hhW = uR * uShapeH * uScale;
    // it floats mid body, so it only takes a fraction of the full bend.
    // the whole path would fold it back on itself at the caps
    // the beam sits behind the glass, so the same bend carries it. push
    // this too far and it tears where the displacement jumps, so the
    // amount is a dial
    vec2 bendUV = Rg.xy / max(0.3, abs(Rg.z)) * thick;
    vec2 wpos = vec2((q.x - c.x) / hwW, (q.y - c.y) / hhW);
    wpos += vec2(bendUV.x / hwW, bendUV.y / hhW) * uWaveBend;
    vec3 wv = waveField(wpos, uTime);

    // slight glass tint toward the rim
    col *= mix(1.0, 0.9, bend);

    // the body is smoked at the top and clears toward the bottom.
    // the fade sits just above center, where the wave will ride
    float hh = uR * uShapeH * uScale;
    float up = (q.y - c.y) / hh;                 // -1 bottom, +1 top
    // wide and eased twice. a narrow ramp reads as an overlay, a long
    // one reads as tinted material. never fully black, the body keeps depth
    float smoke = smoothstep(-0.95 + uSmokePos, 1.0 + uSmokePos, up);
    smoke = smoke * smoke * (3.0 - 2.0 * smoke);
    smoke = smoke * smoke * (3.0 - 2.0 * smoke);
    col = mix(col, col * 0.10, smoke * uSmoke);

    col += wv * uWaveInt;

    // the only colour here comes from the dispersion above. no painted
    // spectrum: the reference keeps its rainbow in the wave, not the rim
    float band = smoothstep(0.14, 0.02, depth) * smoothstep(0.0, 0.02, depth);
    float topness = clamp((q.y - c.y) / uR, -1.0, 1.0);
    col += vec3(1.0) * band * smoothstep(0.45, 1.0, topness) * 0.14;
  }

  // glass casts, but barely: a wide low-density veil below the body and
  // a slightly denser seam at the contact edge. present, never a stain
  float outside = step(0.0, d);
  // a long, low veil falling well below the body, and a tight seam at contact
  float dCast = lensField(q - vec2(0.0, -0.6 * uR), c, uR) / gm;
  float veil = smoothstep(0.55, 0.0, dCast) * outside;
  veil *= veil;
  float seam = smoothstep(0.014, 0.0, d) * outside;
  col *= 1.0 - (veil * uShadow + seam * seam * uShadow * 0.75);

  // the rim is not a stroke. it is the lit edge of a body with thickness:
  // a bright band where the surface turns into the light, fading to
  // nothing on the far side, plus a soft inner falloff for the wall
  vec3 L = normalize(vec3(-0.4, 0.88, 0.26));
  vec3 nrm = normalize(vec3(g / gm, 0.5));
  float facing = clamp(dot(nrm, L), 0.0, 1.0);

  // widths in pixels, not uv. keeps the edge a hairline at any resolution
  float px = 1.0 / uRes.y;
  float band  = smoothstep(px * 2.0, 0.0, abs(d));       // the lit edge
  float wall  = smoothstep(px * 16.0, 0.0, abs(d));      // thickness behind it
  float lit   = pow(facing, 4.0);                        // direct specular

  // light entering the top pools along the lower wall and escapes there.
  // that reflection is brighter than the specular above it
  float down  = clamp(-dot(nrm, L), 0.0, 1.0);
  float tir   = pow(down, 1.6);

  // the edge is lit by the wave behind it and carries its colour
  float hwR = uR * uShapeW * uScale;
  float hhR = uR * uShapeH * uScale;
  // the beam throws light sideways through the body. the wall above it
  // catches the warm half, the wall below catches the cool half, and it
  // burns brightest where the beam runs closest
  float wx = clamp((q.x - c.x) / hwR, -1.4, 1.4);
  float wyy = (q.y - c.y) / hhR;
  float sideD = wyy - waveSpine(wx * 2.3, uTime);
  float kSide = clamp(0.5 - sideD * 1.15, 0.0, 1.0);
  vec3 wcol = spectral(kSide);
  float prox = exp(-sideD * sideD * 3.2) * smoothstep(1.35, 0.2, abs(wx));
  vec3 rimCol = mix(vec3(1.0, 0.99, 0.96), wcol, clamp(prox * uRimTint, 0.0, 1.0));

  // and the wall itself glows a little where the beam meets it
  col += wcol * band * prox * uRimTint * 0.5;
  col += wcol * wall * prox * uRimTint * 0.14;

  col += rimCol * band * lit * uRim;
  col += rimCol * band * tir * uTir;
  col += rimCol * wall * tir * 0.1;
  col += vec3(0.85, 0.9, 1.0) * wall * lit * 0.04;
  col += vec3(1.0) * band * 0.04;

  gl_FragColor = vec4(col, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSrc));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
gl.linkProgram(prog);
gl.useProgram(prog);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

const uTex = gl.getUniformLocation(prog, 'uTex');
const uRes = gl.getUniformLocation(prog, 'uRes');
const uTime = gl.getUniformLocation(prog, 'uTime');
const uPan = gl.getUniformLocation(prog, 'uPan');
const uScale = gl.getUniformLocation(prog, 'uScale');

// press D for the panel
const DEFAULTS = {
  shapeW: 2.10, shapeH: 0.72, thick: 0.75, magnify: 0.55, slope: 3.20, disp: 0.011,
  smoke: 0.82, smokePos: 0.00, waveAmp: 0.30, waveGirth: 0.16, waveInt: 1.15,
  waveSat: 0.22, rim: 0.28, tir: 0.50, shadow: 0.16, rimTint: 1.10, waveBend: 0.55
};
const P = Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem('glassTune') || '{}'));
const U = {};
for (const k in DEFAULTS) U[k] = gl.getUniformLocation(prog, 'u' + k[0].toUpperCase() + k.slice(1));
const uLens = gl.getUniformLocation(prog, 'uLens');
const uRU = gl.getUniformLocation(prog, 'uR');
const uVel = gl.getUniformLocation(prog, 'uVel');

let lx = 0.5, ly = 0.5, vx = 0, vy = 0;

// hover: the body grows a little, springs back when you leave
let scale = 1, scaleT = 1, scaleV = 0;

addEventListener('pointermove', e => {
  const mx = e.clientX / innerWidth, my = 1 - e.clientY / innerHeight;
  const inside = Math.abs(mx - lx) < 0.19 && Math.abs(my - ly) < 0.11;
  scaleT = inside ? 1.12 : 1;
});
addEventListener('pointerleave', () => { scaleT = 1; });

function resize() {
  dpr = Math.min(devicePixelRatio, 2);
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  tex2d.width = canvas.width;
  tex2d.height = canvas.height;
  gl.viewport(0, 0, canvas.width, canvas.height);
  drawBackground();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, tex2d);
}
addEventListener('resize', resize);
resize();

let last = performance.now();
function frame(t) {
  const now = performance.now();
  last = now;

  scaleV += (scaleT - scale) * 0.14 - scaleV * 0.35;
  scale += scaleV;
  gl.uniform1f(uScale, scale);
  for (const k in DEFAULTS) gl.uniform1f(U[k], P[k]);
  // the artwork drifts slowly, so its light-to-dark edge crosses the lens
  const T = t * 0.001;
  gl.uniform2f(uPan, 0.0, 0.0);
  gl.uniform1i(uTex, 0);
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, t * 0.001);
  gl.uniform2f(uLens, lx, ly);
  gl.uniform1f(uRU, 0.13);
  gl.uniform2f(uVel, vx, vy);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- tuning panel ----
const RANGES = {
  shapeW: [0.5, 4, 0.05], shapeH: [0.2, 2, 0.02], thick: [0, 2.5, 0.01],
  magnify: [0, 1.5, 0.01], slope: [0, 8, 0.05], disp: [0, 0.06, 0.001],
  smoke: [0, 1, 0.01], smokePos: [-0.8, 0.8, 0.02], waveAmp: [0, 0.9, 0.01],
  waveGirth: [0.02, 0.5, 0.005], waveInt: [0, 3, 0.02], waveSat: [0.02, 0.8, 0.01],
  rim: [0, 1.5, 0.01], tir: [0, 1.5, 0.01], shadow: [0, 0.6, 0.01], rimTint: [0, 3, 0.05], waveBend: [0, 2, 0.05]
};
const panel = document.getElementById('tune');
panel.innerHTML = Object.keys(RANGES).map(k => {
  const [mn, mx, st] = RANGES[k];
  return `<label>${k.toUpperCase()}<span class="v" id="v_${k}">${P[k]}</span></label>
          <input type="range" id="i_${k}" min="${mn}" max="${mx}" step="${st}" value="${P[k]}">`;
}).join('') + '<div class="btn" id="copy">COPY VALUES</div><div class="btn" id="reset">RESET</div>';

for (const k in RANGES) {
  document.getElementById('i_' + k).addEventListener('input', e => {
    P[k] = parseFloat(e.target.value);
    document.getElementById('v_' + k).textContent = P[k];
    localStorage.setItem('glassTune', JSON.stringify(P));
  });
}
document.getElementById('copy').addEventListener('click', () => {
  navigator.clipboard.writeText(JSON.stringify(P));
  document.getElementById('copy').textContent = 'COPIED';
  setTimeout(() => { document.getElementById('copy').textContent = 'COPY VALUES'; }, 1200);
});
document.getElementById('reset').addEventListener('click', () => {
  Object.assign(P, DEFAULTS);
  localStorage.removeItem('glassTune');
  for (const k in RANGES) {
    document.getElementById('i_' + k).value = P[k];
    document.getElementById('v_' + k).textContent = P[k];
  }
});
addEventListener('keydown', e => {
  if (e.key === 'd' || e.key === 'D') panel.classList.toggle('on');
});
</script>
</body>
</html>
