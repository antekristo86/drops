<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>liquid glass</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: crosshair; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #tune {
    display: none; position: fixed; top: 20px; left: 20px; z-index: 5;
    background: rgba(0,0,0,0.82); border: 1px solid rgba(255,255,255,0.18);
    padding: 14px; width: 250px; max-height: 92vh; overflow: auto;
    font: 11px ui-monospace, monospace; color: #fff; backdrop-filter: blur(8px);
  }
  #tune.on { display: block; }
  #tune label { display: block; margin: 7px 0 1px; color: rgba(255,255,255,0.55); }
  #tune input { width: 100%; accent-color: #fff; }
  #tune .v { float: right; color: #fff; }
  #tune .btn { margin-top: 12px; cursor: pointer; color: rgba(255,255,255,0.6); }
  #tune .btn:hover { color: #fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tune"></div>
<script>
// liquid glass. the ios 27 siri lens as one fragment shader:
// refraction with chromatic split, a prismatic rim, a moving sheen.
// the lens follows the cursor with inertia.
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: false });

// ---- background: a lockscreen-ish surface drawn once ----
const tex2d = document.createElement('canvas');
const ctx = tex2d.getContext('2d');
let dpr = 1;

// black plate with the wordmark centred, so the lens crosses its upper
// half. nothing else, so the lens is the only thing to look at
const ANTE = [
"M249.482 69.2285V317.095H203.55L197.748 279.334C189.045 291.599 177.925 301.442 164.387 308.865C150.849 316.288 135.055 320 117.005 320C94.4421 320 74.2966 314.998 56.5685 304.992C38.8405 294.665 24.9804 279.98 14.9882 260.938C4.99608 241.573 0 218.981 0 193.162C0 167.988 4.99608 145.88 14.9882 126.838C25.3027 107.474 39.324 92.6273 57.052 82.2996C74.7801 71.649 94.7644 66.3238 117.005 66.3238C135.378 66.3238 151.333 69.8739 164.871 76.9743C178.408 83.7519 189.368 93.2728 197.748 105.537L204.034 69.2285H249.482ZM125.708 275.946C147.304 275.946 164.71 268.361 177.925 253.192C191.14 238.023 197.748 218.336 197.748 194.13C197.748 169.602 191.14 149.592 177.925 134.1C164.71 118.608 147.304 110.862 125.708 110.862C104.112 110.862 86.7062 118.608 73.4908 134.1C60.2753 149.269 53.6676 168.956 53.6676 193.162C53.6676 217.69 60.2753 237.7 73.4908 253.192C86.7062 268.361 104.112 275.946 125.708 275.946Z",

function drawBackground() {
  const w = tex2d.width, h = tex2d.height;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);
  const logoW = Math.min(w * 0.30, h * 0.95);
  const sc = logoW / 936;
  const logoH = 320 * sc;
  ctx.save();
  ctx.translate((w - logoW) / 2, h / 2 - logoH * 0.16);
  ctx.scale(sc, sc);
  ctx.fillStyle = '#fff';
  for (const d of ANTE) ctx.fill(new Path2D(d));
  ctx.restore();
}

const vsSrc = `
attribute vec2 p;
varying vec2 vUv;
void main() { vUv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`;

const fsSrc = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uRes;
uniform float uTime;
uniform vec2  uPan;      // background drift
uniform float uScale;    // grows on hover
// glass, figma's model: every dial does exactly one thing
uniform float uLightAngle, uLightPower;   // where the light stands, how hard
uniform float uRefraction;                // how far the ray is pushed
uniform float uDepth;                     // body thickness, drives magnification
uniform float uDispersion;                // spectral split
uniform float uFrost;                     // milkiness
uniform float uSplay;                     // how sharply the rim flares
// this piece specifically
uniform float uShapeW, uShapeH, uSmoke, uSmokePos;
uniform float uShadow;
// the aurora: how bright, how fast it drifts, how tall the rays stand
uniform float uAurora, uAuroraSpeed, uAuroraRay;
uniform float uHover;    // springed 0..1, the aurora breathes in on hover
uniform float uDropHov[3];// each circle's own hover level
uniform float uBounce;   // how much light the bodies throw on each other
uniform vec2 uLens;      // lens center, uv
uniform float uR;        // lens radius, uv (y-normalized)
uniform vec2 uDeform;    // squash and stretch, from the physics
uniform vec2 uDrops[3];  // droplet centres, uv
uniform float uDropRs[3];// their radii, y-normalized. 0 = absent
uniform float uNeck;     // how gooey the join is right now

// a rectangle with rounded corners. exact sdf
float lensField(vec2 q, vec2 c, float r) {
  vec2 halfSize = vec2(r * uShapeW * (1.0 + uDeform.x),
                       r * uShapeH * (1.0 + uDeform.y)) * uScale;
  float rad = halfSize.y;   // always half the height: clean semicircular ends
  vec2 d2 = abs(q - c) - (halfSize - rad);
  return length(max(d2, vec2(0.0))) + min(max(d2.x, d2.y), 0.0) - rad;
}

// the button and the droplet are one liquid. a smooth union joins
// their fields: while they are close the join builds a meniscus, as
// they separate it stretches into a neck, thins, and tears. none of
// that is animated, it falls out of the smin
float scene(vec2 q, vec2 c, float r) {
  float a = lensField(q, c, r);
  float aspect = uRes.x / uRes.y;
  for (int i = 0; i < 3; i++) {
    if (uDropRs[i] < 1e-4) continue;
    vec2 dc = vec2(uDrops[i].x * aspect, uDrops[i].y);
    float b = length(q - dc) - uDropRs[i];
    float h = clamp(0.5 + 0.5 * (b - a) / uNeck, 0.0, 1.0);
    a = mix(b, a, h) - uNeck * h * (1.0 - h);
  }
  return a;
}

// the surface of the glass as a height field. analytic and smooth
// everywhere, so its slope never jumps. the distance field is fine for
// the silhouette, but its gradient flips along the medial axis of any
// straight edge, and that seam prints straight through the body
float domeH(vec2 p, vec2 c, float r) {
  vec2 hs = vec2(r * uShapeW * (1.0 + uDeform.x),
                 r * uShapeH * (1.0 + uDeform.y)) * uScale;
  vec2 u = (p - c) / hs;
  float rr = pow(pow(abs(u.x), 4.0) + pow(abs(u.y), 4.0), 0.25);
  // 1 - r^n. flat through the middle, steepest right at the rim, and
  // that slope stays finite. a hemisphere would run to infinity there
  // and tear; a cosine would flatten out and give no splay at all
  float t = min(rr, 1.0);
  return 1.0 - pow(t, uSplay);
}

// spectrum by wavelength. k = 0 red, k = 1 violet
vec3 spectral(float k) {
  vec3 red    = vec3(1.00, 0.22, 0.20);
  vec3 orange = vec3(1.00, 0.58, 0.18);
  vec3 gold   = vec3(1.00, 0.88, 0.42);
  vec3 green  = vec3(0.50, 0.96, 0.62);
  vec3 cyan   = vec3(0.32, 0.82, 1.00);
  vec3 blue   = vec3(0.36, 0.46, 1.00);
  vec3 a  = mix(red, orange, smoothstep(0.00, 0.22, k));
  vec3 b  = mix(a,   gold,   smoothstep(0.22, 0.42, k));
  vec3 cq = mix(b,   green,  smoothstep(0.42, 0.60, k));
  vec3 dq = mix(cq,  cyan,   smoothstep(0.60, 0.80, k));
  return   mix(dq,   blue,   smoothstep(0.80, 1.00, k));
}

// the hover glow, thin-film style. a rotating rainbow is the cheapest
// trick there is, so instead: a slow interference field runs along the
// outline. light collects in a few travelling pools, parts of the rim
// stay dark, and hue and brightness ride the same phase, the way film
// thickness drives both on a soap bubble. incommensurate frequencies,
// so the pattern never visibly repeats
vec4 glowField(float ang, float t) {
  float ts = t * uAuroraSpeed;
  float ph = sin(ang * 3.0 + ts * 0.23)  * 0.50
           + sin(ang * 5.0 - ts * 0.161 + 1.7) * 0.30
           + sin(ang * 2.0 + ts * 0.097 + 4.1) * 0.28;

  // pools: the field sharpened, so light gathers instead of ringing
  float pool = pow(clamp(ph * 0.6 + 0.5, 0.0, 1.0), 2.6);

  // hue from the same phase, one octave apart
  float k = 0.5 + 0.5 * sin(ph * 2.2 + ts * 0.05);
  vec3 teal   = vec3(0.20, 0.95, 0.90);
  vec3 violet = vec3(0.55, 0.35, 1.00);
  vec3 pink   = vec3(1.00, 0.45, 0.80);
  vec3 h = mix(mix(teal, violet, smoothstep(0.0, 0.55, k)),
               pink, smoothstep(0.55, 1.0, k));
  return vec4(h, pool);
}

void main() {
  float aspect = uRes.x / uRes.y;
  vec2 q = vec2(vUv.x * aspect, vUv.y);
  vec2 c = vec2(uLens.x * aspect, uLens.y);

  // first-order distance: field over gradient magnitude. keeps the rim,
  // shadow and bands equally thick all the way around
  float e = 0.0015;
  float F = scene(q, c, uR);
  vec2 g = vec2(
    scene(q + vec2(e, 0.0), c, uR) - scene(q - vec2(e, 0.0), c, uR),
    scene(q + vec2(0.0, e), c, uR) - scene(q - vec2(0.0, e), c, uR)
  ) / (2.0 * e);
  float gm = max(length(g), 1e-3);
  float d = F / gm;
  vec3 col = texture2D(uTex, vec2(vUv.x + uPan.x, 1.0 - vUv.y + uPan.y)).rgb;

  if (d < 0.0) {
    // ---- the lens ----
    // one idea: push the background outward, nothing at the centre,
    // hardest at the rim, plus the magnification a thick body gives.
    // all of it in body space, so it stays smooth everywhere. distance
    // field gradients and height normals both tear on straight edges
    vec2 hs = vec2(uR * uShapeW * (1.0 + uDeform.x),
                   uR * uShapeH * (1.0 + uDeform.y)) * uScale;
    vec2 u = (q - c) / hs;
    float r = min(pow(pow(abs(u.x), 6.0) + pow(abs(u.y), 6.0), 1.0 / 6.0), 1.0);
    vec2 dir = length(u) > 1e-5 ? normalize(u) : vec2(0.0);

    // inside a droplet, that droplet is the lens. a soft handover in
    // each neck, so the refraction never jumps. the hover level rides
    // along: every body glows only for itself
    vec2 ce = c;
    float hovG = uHover;
    float bodyPh = 0.0;      // every body shimmers on its own phase
    for (int i = 0; i < 3; i++) {
      if (uDropRs[i] < 1e-4) continue;
      vec2 dc = vec2(uDrops[i].x * aspect, uDrops[i].y);
      float rD = length(q - dc) / uDropRs[i];
      float wD = smoothstep(0.12, -0.12, rD - r);
      if (wD > 0.001) {
        vec2 dirD = length(q - dc) > 1e-5 ? normalize(q - dc) : vec2(0.0);
        r = mix(r, min(rD, 1.0), wD);
        dir = normalize(mix(dir, dirD, wD));
        hs = mix(hs, vec2(uDropRs[i]), wD);
        ce = mix(c, dc, wD);
        hovG = mix(hovG, uDropHov[i], wD);
        bodyPh = mix(bodyPh, (float(i) + 1.0) * 2.13, wD);
      }
    }

    float push = pow(r, uSplay) * uRefraction * 0.42;
    float mag  = (1.0 - r * r) * uDepth * 0.30;

    vec2 base = vUv - (q - ce) / vec2(aspect, 1.0) * mag;
    vec2 off  = dir * push * hs / vec2(aspect, 1.0);


    // spectral spread: sample across a run of wavelengths and weight each
    // by its colour. three channels at three offsets gives hard red and
    // blue edges; a weighted fan gives the soft glow real glass has.
    // note the minus: pushing the sample inward bulges the image outward
    vec3 acc3 = vec3(0.0);
    vec3 wsum = vec3(0.0);
    for (int i = 0; i < 9; i++) {
      float k = float(i) / 8.0;
      float sc = 1.0 + uDispersion * 9.0 * (k - 0.5);
      float a2 = float(i) * 0.698;
      vec2 j = vec2(cos(a2), sin(a2)) * uFrost * 0.05 * (0.3 + 0.7 * k);
      vec2 uvS = base - off * sc + j;
      vec3 samp = texture2D(uTex, vec2(uvS.x + uPan.x, 1.0 - uvS.y + uPan.y)).rgb;
      vec3 w = spectral(k) + 0.35;
      acc3 += samp * w;
      wsum += w;
    }
    col = acc3 / max(wsum, vec3(0.001));

    float depth = clamp(1.0 - r, 0.0, 1.0);
    float bend = r * r;

    // slight glass tint toward the rim
    col *= mix(1.0, 0.9, bend);

    // the body is smoked at the top and clears toward the bottom.
    float hh = uR * uShapeH * (1.0 + uDeform.y) * uScale;
    float up = (q.y - c.y) / hh;                 // -1 bottom, +1 top
    // wide and eased twice. a narrow ramp reads as an overlay, a long
    // one reads as tinted material. never fully black, the body keeps depth
    float smoke = smoothstep(-0.95 + uSmokePos, 1.0 + uSmokePos, up);
    smoke = smoke * smoke * (3.0 - 2.0 * smoke);
    smoke = smoke * smoke * (3.0 - 2.0 * smoke);
    col = mix(col, col * 0.10, smoke * uSmoke);

    // the glow clings to the inside of the outline and is gone before
    // the middle. angle and radius in the frame of the body this pixel
    // belongs to, gated by that body's own hover
    vec2 uL = (q - ce) / hs;
    float ga = atan(uL.y, uL.x);
    vec4 gf = glowField(ga + bodyPh, uTime);
    float reach = uAuroraRay * (0.7 + 0.5 * gf.a);
    float glow = pow(smoothstep(1.0 - reach, 1.0, r), 1.6)
               * gf.a * uAurora * hovG;
    col += gf.rgb * glow * 0.62;

    // the only colour in here comes from the dispersion above
    float band = smoothstep(0.14, 0.02, depth) * smoothstep(0.0, 0.02, depth);
    float topness = clamp((q.y - c.y) / uR, -1.0, 1.0);
    col += vec3(1.0) * band * smoothstep(0.45, 1.0, topness) * 0.14;
  }

  // glass casts, but barely: a wide low-density veil below the body and
  // a slightly denser seam at the contact edge. present, never a stain
  float outside = step(0.0, d);
  // a normal drop shadow: small offset down, wide soft blur, very low
  // density. an exponential falloff keeps it from reading as a cloud
  float dCast = scene(q - vec2(0.0, -0.22 * uR), c, uR) / gm;
  float veil = exp(-max(dCast, 0.0) * 11.0) * outside;
  col *= 1.0 - veil * uShadow;

  // the rim is not a stroke. it is the lit edge of a body with thickness:
  // a bright band where the surface turns into the light, fading to
  // nothing on the far side, plus a soft inner falloff for the wall
  vec3 L = normalize(vec3(cos(uLightAngle), sin(uLightAngle), 0.42));
  vec3 nrm = normalize(vec3(g / gm, 0.5));
  float facing = clamp(dot(nrm, L), 0.0, 1.0);

  // widths in pixels, not uv. keeps the edge a hairline at any resolution
  float px = 1.0 / uRes.y;
  float band  = smoothstep(px * 2.0, 0.0, abs(d));       // the lit edge
  float wall  = smoothstep(px * 16.0, 0.0, abs(d));      // thickness behind it
  float lit   = pow(facing, 4.0);                        // direct specular

  // light entering the top pools along the lower wall and escapes there.
  // that reflection is brighter than the specular above it
  float down  = clamp(-dot(nrm, L), 0.0, 1.0);
  float tir   = pow(down, 1.6);

  // the rim carries the same light: whichever body owns this stretch
  // of edge lends its frame and its own hover level
  vec2 hsr = vec2(uR * uShapeW * (1.0 + uDeform.x),
                  uR * uShapeH * (1.0 + uDeform.y)) * uScale;
  vec2 ur = (q - c) / hsr;
  float rSel = pow(pow(abs(ur.x), 6.0) + pow(abs(ur.y), 6.0), 1.0 / 6.0);
  float hovR = uHover;
  float selPh = 0.0;
  for (int i = 0; i < 3; i++) {
    if (uDropRs[i] < 1e-4) continue;
    vec2 dc = vec2(uDrops[i].x * aspect, uDrops[i].y);
    float rD = length(q - dc) / uDropRs[i];
    if (rD < rSel) {
      rSel = rD; ur = (q - dc) / uDropRs[i];
      hovR = uDropHov[i]; selPh = (float(i) + 1.0) * 2.13;
    }
  }
  vec4 gfr = glowField(atan(ur.y, ur.x) + selPh, uTime);
  float aglow = uAurora * hovR * gfr.a;
  vec3 rimCol = mix(vec3(1.0, 0.99, 0.96), gfr.rgb, clamp(aglow * 1.1, 0.0, 1.0));
  col += gfr.rgb * band * aglow * 0.55;
  col += gfr.rgb * wall * aglow * 0.17;
  // light transport: a shining body throws its light onto the others.
  // the stretch of rim facing the source catches exactly the hue the
  // source shows in this direction, and it dies with distance. no body
  // lights itself, that is what the glow above already did
  for (int j = 0; j < 4; j++) {
    vec2 srcP; float srcHov; float srcR; float srcPh;
    if (j == 0) {
      srcP = c; srcHov = uHover; srcR = hsr.y; srcPh = 0.0;
    } else {
      if (uDropRs[j - 1] < 1e-4) continue;
      srcP = vec2(uDrops[j - 1].x * aspect, uDrops[j - 1].y);
      srcHov = uDropHov[j - 1];
      srcR = uDropRs[j - 1];
      srcPh = float(j) * 2.13;
    }
    if (srcHov * uAurora < 0.004) continue;
    if (abs(srcPh - selPh) < 0.01) continue;
    vec2 toSrc = srcP - q;
    float ds = length(toSrc);
    if (ds < 1e-4) continue;
    vec2 Ldir = toSrc / ds;
    float facing2 = clamp(dot(nrm.xy, Ldir), 0.0, 1.0);
    float fall = exp(-max(ds - srcR, 0.0) * 6.0);
    vec4 gs = glowField(atan(-Ldir.y, -Ldir.x) + srcPh, uTime);
    vec3 lc = gs.rgb * gs.a * srcHov * uAurora * uBounce * facing2 * fall;
    col += lc * (band * 0.85 + wall * 0.25);
  }

  // the light does not stop at the wall: where a pool stands, a soft
  // bloom breathes past the rim into the dark. two widths layered, a
  // tight hot seam and a wide faint veil, which is what real bloom is
  float dOut = max(d, 0.0);
  float bloom = exp(-dOut * 34.0) * 0.30 + exp(-dOut * 9.0) * 0.10;
  col += gfr.rgb * bloom * outside * aglow;

  col += rimCol * band * lit * uLightPower * 0.35;
  col += rimCol * band * tir * uLightPower * 0.62;
  col += rimCol * wall * tir * uLightPower * 0.12;
  col += vec3(0.85, 0.9, 1.0) * wall * lit * 0.04;
  col += vec3(1.0) * band * 0.04;

  gl_FragColor = vec4(col, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSrc));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
gl.linkProgram(prog);
gl.useProgram(prog);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

const uTex = gl.getUniformLocation(prog, 'uTex');
const uRes = gl.getUniformLocation(prog, 'uRes');
const uTime = gl.getUniformLocation(prog, 'uTime');
const uPan = gl.getUniformLocation(prog, 'uPan');
const uScale = gl.getUniformLocation(prog, 'uScale');

// press D for the panel
// ante's numbers, dialled in by hand on 2026-08-18. don't touch them
// without being asked
const DEFAULTS = {
  lightAngle: 2.0, lightPower: 0.8, refraction: 0.5, depth: 0.0,
  dispersion: 0.06, frost: 0.0, splay: 7.3,
  shapeW: 1.9, shapeH: 0.64, smoke: 1.0, smokePos: -0.28,
  shadow: 0.6, spacing: 0.93,
  aurora: 0.12, auroraSpeed: 3.0, auroraRay: 0.47, bounce: 1.0
};
const P = Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem('glassTune') || '{}'));
const U = {};
for (const k in DEFAULTS) U[k] = gl.getUniformLocation(prog, 'u' + k[0].toUpperCase() + k.slice(1));
const uLens = gl.getUniformLocation(prog, 'uLens');
const uRU = gl.getUniformLocation(prog, 'uR');
const uDeform = gl.getUniformLocation(prog, 'uDeform');
const uDrops = gl.getUniformLocation(prog, 'uDrops');
const uDropRs = gl.getUniformLocation(prog, 'uDropRs');
const uNeckU = gl.getUniformLocation(prog, 'uNeck');
const uHover = gl.getUniformLocation(prog, 'uHover');
const uDropHov = gl.getUniformLocation(prog, 'uDropHov');

// ============================================================
// physics. the glass is a thing you can throw. while dragging it
// hangs on a stiff spring, so it has weight and its own velocity.
// released, it flies with a little air drag and bounces off the
// window edges. every impact squashes the body, every fast move
// stretches it along the motion, and a jelly spring rings it back
// ============================================================
let lx = 0.5, ly = 0.5, vx = 0, vy = 0;
let tx = 0.5, ty = 0.5;          // where the hand wants it
let dX = 0, dXv = 0;             // squash springs, one per axis
let dY = 0, dYv = 0;
let downMx = 0, downMy = 0;
// three droplets in a row, each its own little body on the same
// springs. they leave one after another and come home in reverse.
// while they are out, the whole composition re-centres: the button
// slides aside exactly half the width the row adds
const ND = 3;
const drops = Array.from({ length: ND }, () => ({
  bx: 0.5, by: 0.5, bvx: 0, bvy: 0, rad: 0, radV: 0, live: false,
  g: 0, gV: 0, hovT: 0,    // its own jelly: swells on hover, sinks on press
  hv: 0, hvV: 0            // its own glow level, breathes like the button's
}));
let pressIdx = -1;          // which circle is held down
let dropOn = false;              // do they want to be out
let dropHome = false;            // heading back in
let phaseT = 0;                  // when the last toggle happened
let sh = 0, shV = 0;             // the centring shift, springed
let homeXg = 0.5, homeYg = 0.5;  // where home is right now
let neck = 0.05;

let scale = 1, scaleT = 1, scaleV = 0;
// the aurora breathes in on hover instead of switching on
let hov = 0, hovT = 0, hovV = 0;
let dragging = false, grabX = 0, grabY = 0;

function lensHalf() {
  const R = 0.13;
  const ar = canvas.width / canvas.height;
  // the deform is part of the true size: the hitbox follows the wobble
  // and so do the droplet slots, which is what makes everything react
  return { hw: R * P.shapeW * scale * (1 + dX) / ar,
           hh: R * P.shapeH * scale * (1 + dY), ar };
}
function dropEffR(D) { return D.rad * (1 + D.g); }
function overDrop(mx, my) {
  const ar = canvas.width / canvas.height;
  for (let i = 0; i < ND; i++) {
    const D = drops[i];
    if (!D.live) continue;
    if (Math.hypot((mx - D.bx) * ar, my - D.by) < dropEffR(D) + 0.015) return i;
  }
  return -1;
}
function overLens(mx, my) {
  const { hw, hh, ar } = lensHalf();
  return Math.abs(mx - lx) < hw + 0.02 / ar && Math.abs(my - ly) < hh + 0.02;
}

addEventListener('pointermove', e => {
  const mx = e.clientX / innerWidth, my = 1 - e.clientY / innerHeight;
  if (dragging) { tx = mx - grabX; ty = my - grabY; return; }
  const inside = overLens(mx, my);
  // the kick carries the swell, the rest point only settles it. without
  // the kick the spring ramps and hover feels heavy next to the rest of
  // the jelly. leaving gets the opposite kick, same snap both ways
  if (inside && !hovT) { dYv += 1.4; dXv += 1.1; }
  if (!inside && hovT) { dYv -= 0.9; dXv -= 0.7; }
  hovT = inside ? 1 : 0;
  const di = overDrop(mx, my);
  for (let i = 0; i < ND; i++) {
    const D = drops[i];
    if (i === di && !D.hovT) D.gV += 1.9;   // it notices you too
    if (i !== di && D.hovT) D.gV -= 1.2;    // and lets go just as fast
    D.hovT = i === di ? 1 : 0;
  }
  canvas.style.cursor = inside ? 'grab' : di >= 0 ? 'pointer' : 'crosshair';
});

canvas.addEventListener('pointerdown', e => {
  const mx = e.clientX / innerWidth, my = 1 - e.clientY / innerHeight;
  const di = overDrop(mx, my);
  if (di >= 0) {
    pressIdx = di;
    drops[di].gV -= 1.3;              // the impact
    canvas.setPointerCapture(e.pointerId);
    return;
  }
  if (!overLens(mx, my)) return;
  dragging = true;
  grabX = mx - lx;
  grabY = my - ly;
  tx = lx; ty = ly;
  canvas.setPointerCapture(e.pointerId);
  canvas.style.cursor = 'grabbing';
  downMx = mx; downMy = my;
  // pressing: the held rest point does the sinking; the kick on top
  // gives the impact. one system, one clock
  dYv -= 1.1;
  dXv -= 0.5;
});
addEventListener('pointerup', e => {
  if (pressIdx >= 0) {
    drops[pressIdx].gV += 1.6;        // release pop, it rings out
    pressIdx = -1;
    return;
  }
  if (!dragging) return;
  dragging = false;
  canvas.style.cursor = 'grab';
  // release: the rest point jumps back to zero and the kick on top
  // makes it pop. it overshoots and rings out on its own
  dYv += 1.5;
  dXv += 0.7;
  const mx = e.clientX / innerWidth, my = 1 - e.clientY / innerHeight;
  scaleT = overLens(mx, my) ? 1.12 : 1;
  // a click, not a drag: the row separates, or comes home
  if (Math.hypot(mx - downMx, my - downMy) < 0.012) {
    dropOn = !dropOn;
    dropHome = !dropOn;
    phaseT = performance.now();
  }
});
addEventListener('pointerleave', () => { scaleT = 1; hovT = 0; });

function physics(dt) {
  // the button has a home. pulling it away is an argument with a spring
  // that stiffens the further you get, and it never fully agrees.
  // the home itself slides aside while the row is out, so button plus
  // droplets stay centred as one composition
  const { hw: hwA, hh: hhA } = lensHalf();
  const aspectJS = canvas.width / canvas.height;
  const rightA = 1 - (0.5 + hwA) > hhA * 3.2 / aspectJS;
  const exA = rightA ? 1 : 0, eyA = rightA ? 0 : -1;
  let rowTot = hhA * (1.80 * P.spacing - 1) + (ND - 1) * hhA * (2.62 * P.spacing - 2);
  for (const D of drops) rowTot += 2 * dropEffR(D);
  const rowE = rowTot / (rightA ? aspectJS : 1);
  const shT = dropOn ? rowE / 2 : 0;
  const shk = 70, shd = 2 * Math.sqrt(shk) * 0.95;
  shV += (shk * (shT - sh) - shd * shV) * dt;
  sh += shV * dt;
  const homeX = 0.5 - exA * sh, homeY = 0.5 - eyA * sh;
  homeXg = homeX; homeYg = homeY;
  const hx = lx - homeX, hy = ly - homeY;
  const pull = Math.hypot(hx, hy);
  const ka = 150 + 2400 * pull * pull;
  if (dragging) {
    const k = 420, d = 2 * Math.sqrt(k);
    vx += (k * (tx - lx) - d * vx) * dt;
    vy += (k * (ty - ly) - d * vy) * dt;
    vx += -ka * hx * dt;
    vy += -ka * hy * dt;
  } else {
    // released: the same spring takes it home, underdamped on purpose.
    // it overshoots, wobbles, settles
    const dmp = 2 * Math.sqrt(ka) * 0.32;
    vx += (-ka * hx - dmp * vx) * dt;
    vy += (-ka * hy - dmp * vy) * dt;
  }
  lx += vx * dt;
  ly += vy * dt;

  // the walls. an impact keeps most of the speed and dumps the rest
  // into the body as squash
  const { hw, hh } = lensHalf();
  const rest = 0.58;
  const kick = 0.55;
  if (lx < hw)     { lx = hw;     if (vx < 0) { dXv -= Math.min(-vx * kick, 3); dYv += Math.min(-vx * kick * 0.7, 2); vx = -vx * rest; } }
  if (lx > 1 - hw) { lx = 1 - hw; if (vx > 0) { dXv -= Math.min(vx * kick, 3);  dYv += Math.min(vx * kick * 0.7, 2);  vx = -vx * rest; } }
  if (ly < hh)     { ly = hh;     if (vy < 0) { dYv -= Math.min(-vy * kick, 3); dXv += Math.min(-vy * kick * 0.7, 2); vy = -vy * rest; } }
  if (ly > 1 - hh) { ly = 1 - hh; if (vy > 0) { dYv -= Math.min(vy * kick, 3);  dXv += Math.min(vy * kick * 0.7, 2);  vy = -vy * rest; } }

  // the row. each droplet hangs on a bouncy spring to its slot, all
  // slots on the button's centre line. the tearing lives at the wall:
  // the join turns gooey there and the wall drags, so each neck reads
  {
    const { hw, hh } = lensHalf();
    const RAD = hh;               // same height as the button
    const aspect = canvas.width / canvas.height;
    const right = rightA;
    const ex = exA, ey = eyA;
    const inX = lx + ex * hw * 0.45, inY = ly + ey * hh * 0.45;
    const tNow = performance.now();
    let anyLive = false, maxZone = 0;

    // the row is laid out over the circles' true current sizes. when
    // one swells, its neighbours' slots move over and their springs
    // carry them there: the whole row wobbles into the new order
    const gW = RAD * (1.80 * P.spacing - 1);
    const gGap = RAD * (2.62 * P.spacing - 2);
    let cumOff = gW;

    for (let i = 0; i < ND; i++) {
      const D = drops[i];
      const eR = dropEffR(D);
      cumOff += eR;
      const off = cumOff;
      cumOff += eR + gGap;
      const slotX = right ? lx + hw + off / aspect : lx;
      const slotY = right ? ly : ly - hh - off;

      const wait = dropOn ? i * 140 : (ND - 1 - i) * 140;
      const active = tNow - phaseT > wait;

      // out-activation: born right at the wall with a push outward
      if (dropOn && active && !D.live) {
        D.live = true;
        D.bx = lx + (right ? hw - RAD * 0.10 : 0);
        D.by = ly + (right ? 0 : -(hh - RAD * 0.10));
        D.bvx = right ? 1.2 : 0;
        D.bvy = right ? 0 : -1.2;
        dXv -= 0.35;             // the recoil of letting go
      }

      const goingOut = dropOn && active;
      const tx2 = goingOut ? slotX : inX;
      const ty2 = goingOut ? slotY : inY;
      if (D.live) {
        const bk = 210, bd = 2 * Math.sqrt(bk) * 0.55;
        D.bvx += (bk * (tx2 - D.bx) - bd * D.bvx) * dt;
        D.bvy += (bk * (ty2 - D.by) - bd * D.bvy) * dt;
        // the wall is sticky: crossing it slows the body so the neck
        // stretches long instead of snapping instantly
        const gap = right ? (D.bx - (lx + hw)) * aspect : (ly - hh) - D.by;
        const zone = Math.exp(-Math.pow(gap / (RAD * 0.9), 2));
        maxZone = Math.max(maxZone, zone);
        const wallDrag = Math.exp(-dt * 5.5 * zone);
        D.bvx *= wallDrag; D.bvy *= wallDrag;
        D.bx += D.bvx * dt;
        D.by += D.bvy * dt;
        // swallowed once fully submerged, nobody sees the shrink
        if (!goingOut &&
            Math.hypot((D.bx - inX) * (right ? aspect : 1), D.by - inY) < RAD * 0.5) {
          D.live = false;
          dXv += 0.55; dYv -= 0.3;   // the gulp, one per droplet
        }
      }
      anyLive = anyLive || D.live;

      // asymmetric radius: out at full size from the wall, home rides
      // on position so the shrink hides inside the body
      const along = right ? Math.abs((D.bx - lx) * aspect) / (hw * aspect)
                          : Math.abs(D.by - ly) / hh;
      const swell = Math.min(Math.max((along - 0.35) / 0.80, 0), 1);
      const radT = !D.live ? 0
                 : goingOut ? RAD
                 : RAD * (0.32 + 0.68 * swell);
      D.radV += (180 * (radT - D.rad) - 2 * Math.sqrt(180) * 0.6 * D.radV) * dt;
      D.rad += D.radV * dt;
      D.rad = Math.max(D.rad, 0);
      // its jelly: hover swells above zero, holding sinks below, the
      // same clock as the big button's
      const gT = pressIdx === i ? -0.10 : D.hovT * 0.11;
      D.gV += (-90 * (D.g - gT) - 2 * Math.sqrt(90) * 0.5 * D.gV) * dt;
      D.g += D.gV * dt;
      D.hv += (D.hovT - D.hv) * Math.min(dt * 6, 1);
    }
    if (dropHome && !anyLive) dropHome = false;
    const neckT = 0.05 + 0.085 * maxZone * ((dropOn || dropHome) ? 1 : 0);
    neck += (neckT - neck) * Math.min(dt * 10, 1);
  }

  // the jelly. underdamped on purpose, it should ring a few times.
  // while held, its rest point sits below zero: the button is pressed
  // in, stays pressed, and springs out of the same system on release
  const jk = 90, jd = 2 * Math.sqrt(90) * 0.5;
  // pressed sinks below zero, hovered swells above it. one system,
  // growth with a wobble instead of a clean scale
  const tX = dragging ? -0.07 : hovT * 0.10;
  const tY = dragging ? -0.13 : hovT * 0.12;
  dXv += (-jk * (dX - tX) - jd * dXv) * dt; dX += dXv * dt;
  dYv += (-jk * (dY - tY) - jd * dYv) * dt; dY += dYv * dt;
}

// stretch is not stored, it is read off the velocity: fast along x
// means longer and flatter, and the sum stays near volume neutral
function deformNow() {
  // held off centre it stretches like taffy along the pull; moving fast
  // it stretches along the motion. both read straight off the state
  // measured from where home is now, not from the screen centre: the
  // centring slide must not read as a pull
  const sx = Math.min(Math.abs(vx) * 0.22, 0.20) + Math.min(Math.abs(lx - homeXg) * 0.9, 0.22);
  const sy = Math.min(Math.abs(vy) * 0.22, 0.20) + Math.min(Math.abs(ly - homeYg) * 0.9, 0.22);
  const ux = Math.max(-0.30, Math.min(0.35, dX + sx - sy * 0.6));
  const uy = Math.max(-0.30, Math.min(0.35, dY + sy - sx * 0.6));
  return [ux, uy];
}

function resize() {
  dpr = Math.min(devicePixelRatio, 2);
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  tex2d.width = canvas.width;
  tex2d.height = canvas.height;
  gl.viewport(0, 0, canvas.width, canvas.height);
  drawBackground();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, tex2d);
}
addEventListener('resize', resize);
resize();

let last = performance.now();
function frame(t) {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  physics(dt);

  scaleV += (scaleT - scale) * 0.045 - scaleV * 0.26;
  scale += scaleV;
  // grabbing kills the glow: hover is an invitation, holding is holding
  const ht = dragging ? 0 : hovT;
  hovV += (ht - hov) * 0.030 - hovV * 0.24;
  hov += hovV;
  gl.uniform1f(uHover, Math.max(0, hov));
  gl.uniform1fv(uDropHov, drops.map(D => Math.max(0, D.hv)));
  gl.uniform1f(uScale, scale);
  for (const k in DEFAULTS) gl.uniform1f(U[k], P[k]);
  // the artwork drifts slowly, so its light-to-dark edge crosses the lens
  const T = t * 0.001;
  gl.uniform2f(uPan, 0.0, 0.0);
  gl.uniform1i(uTex, 0);
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, t * 0.001);
  gl.uniform2f(uLens, lx, ly);
  gl.uniform1f(uRU, 0.13);
  const [ux, uy] = deformNow();
  gl.uniform2f(uDeform, ux, uy);
  gl.uniform2fv(uDrops, drops.flatMap(D => [D.bx, D.by]));
  gl.uniform1fv(uDropRs, drops.map(D => dropEffR(D)));
  gl.uniform1f(uNeckU, neck);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- tuning panel ----
const RANGES = {
  lightAngle: [0, 6.28, 0.02], lightPower: [0, 2, 0.02], refraction: [0, 2.5, 0.01],
  depth: [0, 2, 0.02], dispersion: [0, 0.06, 0.001], frost: [0, 1, 0.01],
  splay: [1.5, 10, 0.1],
  shapeW: [0.5, 4, 0.05], shapeH: [0.2, 2, 0.02], smoke: [0, 1, 0.01],
  smokePos: [-0.8, 0.8, 0.02],
  shadow: [0, 0.6, 0.01], spacing: [0.7, 2, 0.01],
  aurora: [0, 2, 0.02], auroraSpeed: [0, 3, 0.02], auroraRay: [0.15, 1.5, 0.01],
  bounce: [0, 6, 0.05]
};
const panel = document.getElementById('tune');
panel.innerHTML = Object.keys(RANGES).map(k => {
  const [mn, mx, st] = RANGES[k];
  return `<label>${k.toUpperCase()}<span class="v" id="v_${k}">${P[k]}</span></label>
          <input type="range" id="i_${k}" min="${mn}" max="${mx}" step="${st}" value="${P[k]}">`;
}).join('') + '<div class="btn" id="copy">COPY VALUES</div><div class="btn" id="reset">RESET</div>';

for (const k in RANGES) {
  document.getElementById('i_' + k).addEventListener('input', e => {
    P[k] = parseFloat(e.target.value);
    document.getElementById('v_' + k).textContent = P[k];
    localStorage.setItem('glassTune', JSON.stringify(P));
  });
}
document.getElementById('copy').addEventListener('click', () => {
  navigator.clipboard.writeText(JSON.stringify(P));
  document.getElementById('copy').textContent = 'COPIED';
  setTimeout(() => { document.getElementById('copy').textContent = 'COPY VALUES'; }, 1200);
});
document.getElementById('reset').addEventListener('click', () => {
  Object.assign(P, DEFAULTS);
  localStorage.removeItem('glassTune');
  for (const k in RANGES) {
    document.getElementById('i_' + k).value = P[k];
    document.getElementById('v_' + k).textContent = P[k];
  }
});
addEventListener('keydown', e => {
  if (e.key === 'd' || e.key === 'D') panel.classList.toggle('on');
});
</script>
</body>
</html>
